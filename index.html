<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tFish Int • Multi Media</title>
    <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="fonts/fonts.css" rel="stylesheet">
    <style>
        :root {
            --obsidian-deep: #020402;
            --stellar-green: #0a2e1c;
            --ethereal-green: #1a5c3d;
            --neon-accent: #4ade80;
            --grain-opacity: 0.04;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--obsidian-deep);
            color: #e0e0e0;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Stellar Grain Filter Overlay.
           A small seamless noise tile, repeated: drawing the noise once at full-window size was slow
           on load and on every window resize. */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: var(--grain-opacity);
            background: url("data:image/svg+xml,%3Csvg width='256' height='256' viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.144' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }

        /* Starfield Background */
        .starfield {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(1px 1px at 25% 35%, #fff 50%, transparent 50%),
                radial-gradient(1px 1px at 50% 10%, #fff 50%, transparent 50%),
                radial-gradient(2px 2px at 15% 85%, #4ade80 50%, transparent 50%),
                radial-gradient(1px 1px at 85% 45%, #fff 50%, transparent 50%),
                radial-gradient(1px 1px at 70% 70%, #fff 50%, transparent 50%);
            background-size: 400px 400px;
            /* 1px steps: a smooth sub-pixel drift made the browser redraw the whole window every frame */
            animation: drift 120s steps(50) infinite;
            opacity: 0.3;
        }

        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(-50px, -50px); }
        }

        /* UI Layout */
        .main-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .header {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.4em;
        }

        .header h1 {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--neon-accent);
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
        }

        /* The Fish Bowl */
        .aquarium-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
        }

        .bowl {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, var(--ethereal-green) 0%, var(--stellar-green) 40%, var(--obsidian-deep) 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                inset 0 0 80px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(10, 46, 28, 0.5),
                inset 0 20px 40px rgba(255, 255, 255, 0.05);
        }

        /* Glass Reflection */
        .bowl::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 30%;
            height: 20%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
            border-radius: 50% 40% 60% 30%;
            filter: blur(8px);
        }

        /* Aerator Bubbles */
        .aerator {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            bottom: 0;
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-500px) scale(1.5); opacity: 0; }
        }

        /* Project Bubbles */
        .project-layer {
            position: absolute;
            inset: 0;
            z-index: 4; /* behind the fish (5), above the aerator bubbles */
            pointer-events: none;
        }

        .project-bubble {
            position: absolute;
            bottom: -110px;
            width: var(--size, 88px);
            height: var(--size, 88px);
            margin-left: calc(var(--size, 88px) / -2);
            pointer-events: auto;
            animation: project-rise var(--dur, 16s) linear infinite backwards;
        }

        .project-bubble-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.35) 0 6%, rgba(255, 255, 255, 0.06) 22%, rgba(74, 222, 128, 0.08) 60%, rgba(74, 222, 128, 0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 0 18px rgba(74, 222, 128, 0.25), 0 0 12px rgba(74, 222, 128, 0.15);
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            line-height: 1.3;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
            appearance: none;
            animation: project-sway var(--sway, 3.5s) ease-in-out infinite alternate;
            transition: transform 0.25s ease, box-shadow 0.25s ease, color 0.25s ease, opacity 0.25s ease;
        }

        /* Hold still while hovered/focused so it's easy to click. Only that bubble stops: the rest keep
           rising, and one that rises into it pops. */
        .project-bubble:hover,
        .project-bubble:focus-within,
        .project-bubble:hover .project-bubble-inner,
        .project-bubble:focus-within .project-bubble-inner {
            animation-play-state: paused;
        }

        .project-bubble:hover .project-bubble-inner,
        .project-bubble:focus-within .project-bubble-inner {
            transform: scale(1.15);
            color: var(--neon-accent);
            box-shadow: inset 0 0 24px rgba(74, 222, 128, 0.4), 0 0 24px rgba(74, 222, 128, 0.45);
        }

        /* An invisible popped or still-waiting bubble must not count as hovered (it would stop) */
        .project-bubble.popping,
        .project-bubble.waiting {
            pointer-events: none;
        }

        .project-bubble.popping .project-bubble-inner {
            transform: scale(1.6);
            opacity: 0;
        }

        @keyframes project-rise {
            0% { transform: translateY(0); opacity: 0; }
            8% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(-640px); opacity: 0; }
        }

        @keyframes project-sway {
            from { translate: -10px 0; }
            to { translate: 10px 0; }
        }

        /* Fish shouldn't block clicks on bubbles */
        .fish-swim { pointer-events: none; }

        /* Project Detail: grows out of the clicked bubble to fill the bowl */
        .project-detail {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 70px 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, #1f6b47 0%, var(--stellar-green) 45%, #041009 100%);
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(74, 222, 128, 0.25);
            clip-path: circle(0 at 50% 50%);
            transition: clip-path 0.55s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .project-detail[hidden] { display: none; }

        /* The stats sit over the bottom of the bowl; get them out of the panel's way */
        .stats-overlay { transition: opacity 0.3s ease; }

        .main-stage:has(.project-detail.open) .stats-overlay {
            opacity: 0;
        }

        .project-detail-close {
            position: absolute;
            top: 24px;
            left: 50%;
            translate: -50% 0;
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
            cursor: pointer;
            transition: transform 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .project-detail-close:hover,
        .project-detail-close:focus-visible {
            transform: rotate(90deg);
            color: var(--neon-accent);
            border-color: var(--neon-accent);
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.4);
            outline: none;
        }

        .project-detail-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 320px;
            text-align: center;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .project-detail.open .project-detail-body {
            opacity: 1;
            transform: none;
            transition-delay: 0.25s;
        }

        .project-detail-kicker {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: var(--neon-accent);
            opacity: 0.8;
        }

        .project-detail-title {
            font-size: 1.9rem;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.01em;
            background: linear-gradient(120deg, #fff 0%, #bbf7d0 45%, var(--neon-accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(74, 222, 128, 0.35));
        }

        .project-detail-desc {
            font-size: 0.78rem;
            font-weight: 300;
            line-height: 1.55;
            color: rgba(224, 224, 224, 0.75);
        }

        .project-detail-frame {
            width: 260px;
            margin-top: 4px;
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(74, 222, 128, 0.08);
        }

        .project-detail-frame img {
            display: block;
            width: 100%;
            aspect-ratio: 13 / 7;
            object-fit: cover;
            border-radius: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            .project-detail,
            .project-detail-body { transition: none; }
        }

        /* Cartoon Triggerfish.
           .fish-swim carries the swim keyframes; .fish inside it is tilted and nudged from JS
           (swerving round bubbles, darting from pops) through translate/rotate. Keeping the two
           apart lets the compositor run the swim without waiting on the page's script. */
        .fish-swim {
            position: absolute;
            width: 80px;
            height: 50px;
            z-index: 5;
        }

        .fish {
            position: relative;
            width: 100%;
            height: 100%;
            will-change: transform; /* its own layer, so the per-frame tilt doesn't repaint anything */
        }

        .fish-body {
            position: relative;
            width: 100%;
            height: 100%;
            background: #eab308; /* Cartoon yellow triggerfish base */
            clip-path: polygon(0% 50%, 20% 0%, 80% 10%, 100% 50%, 80% 90%, 20% 100%);
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.3);
        }

        .fish-body::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 15%;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            border: 2px solid white;
        }

        .fish-stripe {
            position: absolute;
            top: 0;
            left: 30%;
            width: 15px;
            height: 100%;
            background: #000;
            opacity: 0.2;
            transform: skewX(-20deg);
        }

        .fin {
            position: absolute;
            background: #ca8a04;
            width: 20px;
            height: 25px;
            left: 10px;
            top: -10px;
            clip-path: polygon(0 100%, 100% 0, 100% 100%);
        }

        .tail {
            position: absolute;
            right: -15px;
            top: 12px;
            width: 25px;
            height: 25px;
            background: #ca8a04;
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
        }

        /* Animations for specific fish. They animate only `transform`, which the browser can run
           off the main thread; animating left/top would need a layout on every frame.
           The fish are drawn facing left; scaleX(-1) turns one to face right, so each swim
           flips the fish whenever it heads right and it always swims head-first. The 51% step
           sits 1/50 of the way along the return leg, so the path doesn't hitch during the flip. */
        .fish-1 { top: 30%; left: -100px; animation: swim1 18s linear infinite; }
        .fish-2 { top: 60%; left: -100px; animation: swim2 24s linear infinite 2s; }
        .fish-3 { top: 45%; right: -100px; animation: swim3 21s linear infinite 5s; }

        @keyframes swim1 {
            0% { transform: translate(0, 0) scaleX(-1); }
            50% { transform: translate(650px, 10px) scaleX(-1); }
            51% { transform: translate(637px, 9.8px) scaleX(1); }
            100% { transform: translate(0, 0) scaleX(1); }
        }

        @keyframes swim2 {
            0% { transform: translateX(0) scale(-0.7, 0.7); }
            100% { transform: translateX(650px) scale(-0.7, 0.7); }
        }

        @keyframes swim3 {
            0% { transform: translate(0, 0) scaleX(1); }
            50% { transform: translate(-650px, 30px) scaleX(1); }
            51% { transform: translate(-637px, 29.4px) scaleX(-1); }
            100% { transform: translate(0, 0) scaleX(-1); }
        }

        /* Data Overlay */
        .stats-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--neon-accent);
            opacity: 0.6;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
        }

        .etching-label {
            position: absolute;
            top: 50%;
            right: -120px;
            transform: rotate(90deg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            opacity: 0.3;
            letter-spacing: 0.8em;
        }
    </style>
</head>
<body>

    <div class="grain-overlay"></div>
    <div class="starfield"></div>

    <main class="main-stage">
        <header class="header">
            <h1>tFish Int • Multi Media</h1>
        </header>

        <div class="aquarium-wrapper">
            <div class="bowl">
                <!-- Aerator Bubbles Spawner -->
                <div class="aerator" id="bubble-container"></div>

                <!-- Project Bubbles + detail panel -->
                <div class="project-layer" id="project-layer"></div>

                <div class="project-detail" id="project-detail" role="dialog" aria-labelledby="project-detail-title" hidden>
                    <button class="project-detail-close" type="button" aria-label="Close">
                        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                            <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <div class="project-detail-body">
                        <span class="project-detail-kicker"></span>
                        <h2 class="project-detail-title" id="project-detail-title"></h2>
                        <p class="project-detail-desc"></p>
                        <div class="project-detail-frame"><img alt=""></div>
                    </div>
                </div>
                
                <!-- Fish 1 -->
                <div class="fish-swim fish-1">
                    <div class="fish">
                        <div class="fin"></div>
                        <div class="fish-body">
                            <div class="fish-stripe"></div>
                        </div>
                        <div class="tail"></div>
                    </div>
                </div>

                <!-- Fish 2 -->
                <div class="fish-swim fish-2">
                    <div class="fish">
                        <div class="fin" style="background: #ef4444;"></div>
                        <div class="fish-body" style="background: #f87171;">
                            <div class="fish-stripe"></div>
                        </div>
                        <div class="tail" style="background: #ef4444;"></div>
                    </div>
                </div>

                <!-- Fish 3 -->
                <div class="fish-swim fish-3">
                    <div class="fish">
                        <div class="fin" style="background: #3b82f6;"></div>
                        <div class="fish-body" style="background: #60a5fa;">
                            <div class="fish-stripe"></div>
                        </div>
                        <div class="tail" style="background: #3b82f6;"></div>
                    </div>
                </div>
            </div>
            <div class="etching-label">media solve web</div>
        </div>

        <div class="stats-overlay">
            <div class="stat-item">
                <span class="stat-label">OXYGEN</span>
                <span class="stat-value">98.2%</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">DEPTH</span>
                <span class="stat-value">2ft</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">TEMP</span>
                <span class="stat-value">72°F</span>
            </div>
        </div>
    </main>

    <script>
        const bubbleContainer = document.getElementById('bubble-container');
        const bubbleCount = 20;

        for (let i = 0; i < bubbleCount; i++) {
            createBubble();
        }

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const size = Math.random() * 8 + 4;
            const left = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 5;

            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${left}%`;
            bubble.style.animationDuration = `${duration}s`;
            bubble.style.animationDelay = `${delay}s`;

            bubbleContainer.appendChild(bubble);

            // Recycle bubble
            bubble.addEventListener('animationiteration', () => {
                bubble.style.left = `${Math.random() * 100}%`;
            });
        }

        // Edit this list: one bubble per project. Swap `image` for a real path like 'img/project-one.jpg'
        const placeholderText = 'A short description of this project: what it is, who it was for and what you made. Replace this with a sentence or two about the work.';
        const projects = [
            { title: 'Project One', description: placeholderText, image: placeholderImage('Project One', 150) },
            { title: 'Project Two', description: placeholderText, image: placeholderImage('Project Two', 190) },
            { title: 'Project Three', description: placeholderText, image: placeholderImage('Project Three', 45) },
            { title: 'Project Four', description: placeholderText, image: placeholderImage('Project Four', 280) },
            { title: 'Project Five', description: placeholderText, image: placeholderImage('Project Five', 330) },
            { title: 'Project Six', description: placeholderText, image: placeholderImage('Project Six', 15) },
            { title: 'Project Seven', description: placeholderText, image: placeholderImage('Project Seven', 100) },
            { title: 'Project Eight', description: placeholderText, image: placeholderImage('Project Eight', 230) },
        ];

        // Simple generated landscape so each project has an image until real ones are added
        function placeholderImage(label, hue) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280">
                <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="hsl(${hue},45%,30%)"/><stop offset="1" stop-color="hsl(${hue},55%,10%)"/>
                </linearGradient></defs>
                <rect width="520" height="280" fill="url(#g)"/>
                <circle cx="390" cy="85" r="34" fill="hsl(${hue},70%,75%)" opacity="0.8"/>
                <path d="M0 280L140 140L230 220L320 120L520 280Z" fill="hsl(${hue},40%,18%)"/>
                <text x="24" y="44" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="16" letter-spacing="4">${label.toUpperCase()}</text>
            </svg>`;
            return `data:image/svg+xml,${encodeURIComponent(svg)}`;
        }

        const projectLayer = document.getElementById('project-layer');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const riseDuration = 16;
        const startleGap = 40; // px from the popped bubble's edge to a fish's body for that fish to dart away

        // Per-fish steering state: a swerve around bubbles plus an optional startle dart.
        // The swim keyframes move, turn and scale each fish's .fish-swim wrapper; the steering
        // nudges and tilts the .fish inside it.
        const fishState = new Map();
        document.querySelectorAll('.fish').forEach((fish) => {
            fishState.set(fish, {
                swim: fish.parentElement,
                width: fish.offsetWidth,
                height: fish.offsetHeight,
                pos: null, // where it's drawn this frame, from readFish
                trackY: 0, // how far startles have moved the fish's track up or down from its swim path
                plan: [], planStart: 0, planAge: Infinity, // the swerve it's following, and when it started
                avoidY: 0, vy: 0, tilt: 0, dir: 1, speed: 0, lastX: null, dart: null,
                applied: { x: 0, y: 0 }, // the on-screen offset set last frame, taken back off the measured position
            });
        });
        const relaxSpeed = 35;  // px/s it drifts back to its track
        const steerAccel = 300; // px/s² a swerve can speed up, slow down or reverse, so changes of course ease in and out
        const riseSpeed = 640 / riseDuration; // px/s, matches the project-rise keyframes

        // Swerve planning. A swerve is a list of [speed, seconds] stages (up is -), then a drift back to the
        // track. A few times a second each fish plays some swerves a few seconds ahead against where every
        // bubble will have risen to, and follows the gentlest one that gets past them all.
        const planEvery = 0.08;  // s between re-plans
        const planHorizon = 4.5; // s each swerve is played ahead
        const planStep = 0.1;    // s between checks along a swerve
        const planSpeeds = [-90, -60, -40, -20, 0, 20, 40, 60, 90]; // px/s
        // One-stage swerves, tried every time
        const simpleSwerves = [0.8, 1.6, planHorizon].flatMap((d) => planSpeeds.map((v) => [[v, d]]));
        // Two-stage swerves, to thread one gap and then the next; only searched when nothing simpler gets
        // through, gentlest first
        const swerveEffort = (stages) => stages.reduce((sum, [v, d]) => sum + Math.abs(v) * Math.min(d, 2), 0);
        const twoStageSwerves = [0.4, 0.8, 1.5, 2.5].flatMap((d1) => planSpeeds.flatMap((v1) =>
            [0.8, 1.6, 3].flatMap((d2) => planSpeeds.map((v2) => [[v1, d1], [v2, d2]]))))
            .sort((a, b) => swerveEffort(a) - swerveEffort(b));

        // Fish keep their centre within this part of the bowl's height, so swerves and darts stay in the water
        function waterLimits(bowlRect) {
            return [bowlRect.top + bowlRect.height * 0.16, bowlRect.top + bowlRect.height * 0.84];
        }
        // Slow a swerve as the fish nears the edge of the water, so it eases to a stop there rather than hitting it
        const edgeEase = 3; // 1/s
        function easeAtEdge(want, y, waterMin, waterMax) {
            return Math.max(-(y - waterMin) * edgeEase, Math.min((waterMax - y) * edgeEase, want));
        }
        // Startles move a fish's track, but only within the middle of the bowl. Every bubble rises right to the
        // top, so a fish pushed up there would have nowhere left to dodge.
        function trackLimits(bowlRect) {
            return [bowlRect.top + bowlRect.height * 0.25, bowlRect.top + bowlRect.height * 0.7];
        }

        // Read where a fish is drawn, once per frame, for both the bubble hit test and the steering:
        // its centre, which way it faces, its scale (the swim keyframes shrink one fish and mirror
        // them to turn) and an unrotated box, since tilting would inflate getBoundingClientRect.
        function readFish(fish, state) {
            const m = new DOMMatrixReadOnly(getComputedStyle(state.swim).transform);
            const r = fish.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            const scale = Math.abs(m.d) || 1; // only the x scale flips, so the y scale is the drawn size
            const w = state.width * scale / 2;
            const h = state.height * scale / 2;
            return {
                cx, cy, scale, scaleX: m.a, halfWidth: w, halfHeight: h,
                facing: m.a < 0 ? 1 : -1, // drawn facing left; mirrored = facing right
                box: { left: cx - w, right: cx + w, top: cy - h, bottom: cy + h, width: w * 2, height: h * 2 },
            };
        }
        const noOffset = { x: 0, y: 0, rot: 0 };

        const smoothstep = (k) => k * k * (3 - 2 * k);
        const mix = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, rot: a.rot + (b.rot - a.rot) * k });

        // Dart out over 0.35s, hold, then drift back over 1.8s
        function dartAt(d, now) {
            if (!d) return noOffset;
            const t = (now - d.start) / 1000;
            if (t < 0.35) return mix(d.from, d.to, smoothstep(t / 0.35));
            if (t < 0.7) return d.to;
            if (t < 2.5) return mix(d.to, noOffset, smoothstep((t - 0.7) / 1.8));
            return noOffset;
        }
        function dartOffset(state, now) {
            if (state.dart && now - state.dart.start >= 2500) state.dart = null;
            return dartAt(state.dart, now);
        }

        // When (in s) a fish swimming on at its speed first bumps a bubble, if it's at height ys[k] at time
        // (k + 1) * planStep; Infinity if it never does. The hit test, a few px wider, against each bubble
        // risen that much further (at its `rise` speed: 0 while someone has it stopped).
        function firstBump(state, fishX, ys, reachX, clearance, near) {
            const speed = Math.max(state.speed, 20);
            for (let k = 0; k < ys.length; k++) {
                const t = (k + 1) * planStep;
                const x = fishX + state.dir * speed * t;
                const y = ys[k];
                for (const { cx, cy, radius, rise } of near) {
                    const by = cy - rise * t;
                    const dx = cx - Math.max(x - reachX, Math.min(cx, x + reachX));
                    const dy = by - Math.max(y - clearance, Math.min(by, y + clearance));
                    if (dx * dx + dy * dy < (radius + 6) ** 2) return t;
                }
            }
            return Infinity;
        }

        // Fish near a popped bubble dart away from it, then settle only halfway back
        function startleFish(bubble) {
            if (reduceMotion) return;
            const now = performance.now();
            const pop = bubble.getBoundingClientRect();
            const popX = pop.left + pop.width / 2;
            const popY = pop.top + pop.height / 2;
            const popRadius = pop.width / 2;
            const others = [...document.querySelectorAll('.project-bubble:not(.popping, .waiting)')]
                .filter((b) => b !== bubble)
                .map((b) => {
                    const o = b.getBoundingClientRect();
                    const rise = b.matches(':hover, :focus-within') ? 0 : riseSpeed;
                    return { cx: o.left + o.width / 2, cy: o.top + o.height / 2, radius: o.width / 2, rise };
                });

            const bowlRect = bowl.getBoundingClientRect();
            const [waterMin, waterMax] = waterLimits(bowlRect);
            const [trackMin, trackMax] = trackLimits(bowlRect);

            fishState.forEach((state) => {
                if (!state.pos) return;
                const { box, cx: fishX, cy: fishY, halfWidth, halfHeight } = state.pos;
                // Only fish close to the bubble react: measure from its edge to the nearest point of the fish
                const nearestX = Math.max(box.left, Math.min(popX, box.right));
                const nearestY = Math.max(box.top, Math.min(popY, box.bottom));
                const gap = Math.max(0, Math.hypot(popX - nearestX, popY - nearestY) - popRadius);
                if (gap > startleGap) return;

                const dy = fishY - popY;
                let push = 30 + (1 - gap / startleGap) * 70; // closer = bigger dart
                // Flee straight up or down, away from the pop, and keep swimming forward. Fleeing
                // sideways would back the fish up tail-first when the pop is ahead of it, or on the drift back.
                const away = dy < 0 ? -1 : 1; // -1 = up
                push = Math.min(push, Math.max(0, away < 0 ? fishY - waterMin : waterMax - fishY)); // stay in the water

                // Nose points along the dart: up when fleeing upward, down when fleeing downward
                const tilt = state.dir * away * (8 + Math.random() * 8);
                // The fish's track moves by half the dart, so it drifts back only halfway. The dart is measured
                // from the new track, shifted so the fish doesn't jump.
                const pathY = fishY - state.applied.y;
                const current = dartOffset(state, now);
                const makeDart = (size) => {
                    const trackY = Math.max(trackMin - pathY, Math.min(trackMax - pathY, state.trackY + away * size / 2));
                    const shift = trackY - state.trackY;
                    const dart = { start: now, from: { ...current, y: current.y - shift }, to: { x: 0, y: away * size - shift, rot: tilt } };
                    // Where it takes the fish over the next 2s, to check against the other bubbles
                    const ys = Array.from({ length: 20 }, (_, k) =>
                        pathY + trackY + state.avoidY + dartAt(dart, now + (k + 1) * planStep * 1000).y);
                    return { trackY, dart, bumpAt: firstBump(state, fishX, ys, halfWidth * 0.7, halfHeight * 0.6, others) };
                };
                // The full dart if its path stays clear of the other bubbles, else the longest shorter one that
                // does, else whichever bumps latest
                const options = [1, 0.7, 0.5, 0.3, 0.15].map((k) => makeDart(push * k));
                const pick = options.find((o) => o.bumpAt === Infinity)
                    ?? options.reduce((a, b) => (b.bumpAt > a.bumpAt ? b : a));
                state.trackY = pick.trackY;
                state.dart = pick.dart;
            });
        }

        // Pick the swerve a fish should follow from now: a list of stages, empty to drift back to its track
        function planSwerve(state, now, fishX, fishY, baseY, reachX, clearance, bubbles, waterMin, waterMax) {
            const speed = Math.max(state.speed, 20);
            // Only bubbles the fish could reach within the horizon matter
            const near = bubbles.filter(({ cx, radius }) => {
                const ahead = (cx - fishX) * state.dir;
                return ahead > -(radius + reachX) && ahead < speed * planHorizon + radius + reachX;
            });
            if (!near.length) return [];

            const relaxV = (y) => Math.max(-relaxSpeed, Math.min(relaxSpeed, (baseY - y) * 2));
            // A dart in progress carries on moving the fish, on top of the swerve
            const dartNow = dartAt(state.dart, now).y;
            const dartAhead = Array.from({ length: Math.round(planHorizon / planStep) }, (_, k) =>
                dartAt(state.dart, now + (k + 1) * planStep * 1000).y - dartNow);
            // Play a swerve ahead: when (if ever) it bumps a bubble, and how far off the track it strays
            const play = (stages) => {
                let y = fishY - dartNow, vel = state.vy, stray = 0;
                const ys = dartAhead.map((dart, k) => {
                    const t = (k + 1) * planStep;
                    let want = null;
                    for (let i = 0, end = 0; i < stages.length && want === null; i++) {
                        end += stages[i][1];
                        if (t <= end) want = stages[i][0];
                    }
                    const target = easeAtEdge(want ?? relaxV(y), y, waterMin, waterMax);
                    vel += Math.max(-steerAccel * planStep, Math.min(steerAccel * planStep, target - vel));
                    y = Math.max(waterMin, Math.min(waterMax, y + vel * planStep));
                    stray += Math.abs(y - baseY) * planStep;
                    return y + dartNow + dart;
                });
                return { stages, bumpAt: firstBump(state, fishX, ys, reachX, clearance, near), stray };
            };

            // Never bumping comes first, then a later bump over an earlier one; after that, stray little, swerve
            // gently, and stick with the current swerve rather than flip-flopping
            const firstSpeed = (stages) => (stages.length ? stages[0][0] : relaxV(fishY));
            const currentSpeed = firstSpeed(remainingStages(state, now));
            const cost = ({ stages, bumpAt, stray }) => (bumpAt < Infinity ? 1e4 + 1e3 * (planHorizon - bumpAt) : 0)
                + stray * 0.25 + swerveEffort(stages) * 0.5 + Math.abs(firstSpeed(stages) - currentSpeed) * 1.2;
            let best = [remainingStages(state, now), [], ...simpleSwerves]
                .map(play).reduce((a, b) => (cost(b) < cost(a) ? b : a));

            // Nothing simple gets through: look for a two-stage swerve that does (not too often, as it's slower)
            if (best.bumpAt < Infinity && now >= (state.searchAfter ?? 0)) {
                const threads = twoStageSwerves.find((stages) => play(stages).bumpAt === Infinity);
                if (threads) best = play(threads);
                else state.searchAfter = now + 400;
            }
            return best.stages;
        }

        // What's left of the swerve a fish is following, from now
        function remainingStages(state, now) {
            let elapsed = (now - state.planStart) / 1000;
            const left = [];
            for (const [v, d] of state.plan) {
                if (elapsed < d) left.push([v, d - elapsed]);
                elapsed = Math.max(0, elapsed - d);
            }
            return left;
        }

        // Steer each fish round the bubbles ahead of it, swerving only as hard as it needs to
        function steerFish(dt, now, bubbles, bowlRect) {
            const [waterMin, waterMax] = waterLimits(bowlRect);
            fishState.forEach((state, fish) => {
                const { cx: fishX, cy: fishY, halfWidth, halfHeight, facing, scale, scaleX } = state.pos;
                const dart = dartOffset(state, now);
                // Where the swim keyframes alone put the fish (the measured centre minus the offset set last
                // frame), and its track: that path moved up or down by earlier startles
                const pathX = fishX - state.applied.x;
                const pathY = fishY - state.applied.y;
                const baseY = pathY + state.trackY;
                const vx = state.lastX === null ? 0 : (pathX - state.lastX) / dt;
                if (Math.abs(vx) < 1000) state.speed += (Math.abs(vx) - state.speed) * Math.min(1, dt * 4); // ignore loop jumps
                state.lastX = pathX;
                // Point the way the swim keyframes face the fish (mirrored = facing right), rather than
                // guessing from frame-to-frame movement, which darts and swerves throw off
                state.dir = facing;

                // Match the hit test's inset box (15% / 20% trimmed off each side)
                const reachX = halfWidth * 0.7;
                const clearance = halfHeight * 0.6;
                state.planAge += dt;
                if (state.planAge >= planEvery) {
                    state.planAge = 0;
                    state.plan = planSwerve(state, now, fishX, fishY, baseY, reachX, clearance, bubbles, waterMin, waterMax);
                    state.planStart = now;
                }

                // Swerve at the planned speed, letting it build up and ease off rather than snapping
                const stage = remainingStages(state, now)[0];
                const wantVy = easeAtEdge(stage ? stage[0] : Math.max(-relaxSpeed, Math.min(relaxSpeed, -state.avoidY * 2)),
                    baseY + state.avoidY, waterMin, waterMax);
                const accel = steerAccel * dt;
                state.vy += Math.max(-accel, Math.min(accel, wantVy - state.vy));
                state.avoidY += state.vy * dt;
                // Stay in the water (a backstop: the easing above normally stops it first)
                const low = waterMin - baseY, high = waterMax - baseY;
                if (state.avoidY < low || state.avoidY > high) {
                    state.avoidY = Math.max(low, Math.min(high, state.avoidY));
                    state.vy = 0;
                }

                // Nose follows the swerve: up when rising, down when diving
                const tiltTarget = Math.max(-25, Math.min(25,
                    state.dir * Math.atan2(state.vy, Math.max(state.speed, 40)) * 180 / Math.PI));
                // Turning the nose no faster than 60°/s keeps quick weaves between bubbles from reading as a wiggle
                const turn = (tiltTarget - state.tilt) * Math.min(1, dt * 4);
                state.tilt += Math.max(-60 * dt, Math.min(60 * dt, turn));

                // Worked out on screen, then set inside the wrapper: undo its scale, and mirror the
                // tilt when the fish is turned round
                state.applied = { x: dart.x, y: state.trackY + state.avoidY + dart.y };
                const localX = Math.abs(scaleX) > 0.05 ? state.applied.x / scaleX : 0;
                fish.style.translate = `${localX}px ${state.applied.y / scale}px`;
                fish.style.rotate = `${(scaleX < 0 ? -1 : 1) * (dart.rot + state.tilt)}deg`;
            });
        }

        // Pops in place; the bubble stays hidden (and out of the tab order) until its next pass from the bottom
        function popBubble(bubble) {
            bubble.classList.add('popping');
            bubble.poppedAt = performance.now();
            bubble.querySelector('button').tabIndex = -1;
            startleFish(bubble);
        }

        // Project detail panel
        const bowl = document.querySelector('.bowl');
        const detail = document.getElementById('project-detail');
        const detailClose = detail.querySelector('.project-detail-close');
        let detailOrigin = 'circle(0 at 50% 50%)';

        function openDetail(project, index, bubble) {
            const bowlRect = bowl.getBoundingClientRect();
            const r = bubble.getBoundingClientRect();
            // Start the reveal as a circle exactly where the bubble was
            detailOrigin = `circle(${r.width / 2}px at ${r.left + r.width / 2 - bowlRect.left}px ${r.top + r.height / 2 - bowlRect.top}px)`;

            detail.querySelector('.project-detail-kicker').textContent =
                `${String(index + 1).padStart(2, '0')} / ${String(projects.length).padStart(2, '0')}`;
            detail.querySelector('.project-detail-title').textContent = project.title;
            detail.querySelector('.project-detail-desc').textContent = project.description;
            const img = detail.querySelector('.project-detail-frame img');
            img.src = project.image;
            img.alt = project.title;

            detail.style.clipPath = detailOrigin;
            detail.hidden = false;
            detail.offsetWidth; // apply the start shape before transitioning
            detail.classList.add('open');
            detail.style.clipPath = 'circle(50% at 50% 50%)';
            detailClose.focus();
        }

        function closeDetail() {
            if (detail.hidden) return;
            detail.classList.remove('open');
            detail.style.clipPath = detailOrigin;
            detailClose.blur();
            if (reduceMotion) detail.hidden = true;
        }

        detail.addEventListener('transitionend', (e) => {
            if (e.target === detail && e.propertyName === 'clip-path' && !detail.classList.contains('open')) {
                detail.hidden = true;
            }
        });
        detailClose.addEventListener('click', closeDetail);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDetail();
        });

        // Bubbles take turns between a left and a right lane. With eight rising only ~80px apart,
        // neighbours would overlap if they could land in the same spot.
        const laneLeft = (i) => `${(i % 2 ? 58 : 28) + Math.random() * 14}%`;

        // Still bubbles for reduced motion, as [left, centre height] in % of the bowl: rows of 3, 2 and 3.
        // Room for eight; add spots here if you add more projects.
        const stillSpots = [[26, 32], [50, 32], [74, 32], [38, 54], [62, 54], [26, 76], [50, 76], [74, 76]];

        // A spread of sizes, from slightly smaller bubbles (68px) up to the biggest (100px), handed out at random
        const bubbleSizes = projects.map((_, i) => 68 + (32 * i) / Math.max(1, projects.length - 1));
        for (let i = bubbleSizes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [bubbleSizes[i], bubbleSizes[j]] = [bubbleSizes[j], bubbleSizes[i]];
        }

        projects.forEach((project, i) => {
            const bubble = document.createElement('div');
            bubble.className = 'project-bubble';
            bubble.style.setProperty('--size', `${bubbleSizes[i]}px`);
            bubble.style.setProperty('--dur', `${riseDuration}s`);
            bubble.style.setProperty('--sway', `${3 + Math.random() * 2}s`);
            bubble.style.left = laneLeft(i);
            // The tank starts empty: each bubble sets off from the bottom in turn, spaced evenly
            // through the first rise. Until its turn it waits, unseen, below the glass.
            bubble.style.animationDelay = `${(i / projects.length) * riseDuration}s`;

            if (reduceMotion) {
                bubble.style.animation = 'none';
                const [left, height] = stillSpots[i % stillSpots.length];
                bubble.style.left = `${left}%`;
                bubble.style.bottom = `calc(${height}% - var(--size) / 2)`;
            }

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'project-bubble-inner';
            button.textContent = project.title;
            if (reduceMotion) button.style.animation = 'none';

            // Pop the bubble and grow the detail panel out of it
            button.addEventListener('click', () => {
                openDetail(project, i, bubble);
                popBubble(bubble);
            });

            // A waiting bubble is out of the tab order and ignored by the fish until it sets off
            if (!reduceMotion) {
                bubble.classList.add('waiting');
                button.tabIndex = -1;
                bubble.addEventListener('animationstart', (e) => {
                    if (e.target !== bubble) return;
                    bubble.classList.remove('waiting');
                    button.tabIndex = 0;
                });
            }

            // New x position each time it re-enters from the bottom; a popped bubble respawns
            bubble.addEventListener('animationiteration', (e) => {
                if (e.target !== bubble) return;
                bubble.style.left = laneLeft(i);
                bubble.classList.remove('popping');
                button.tabIndex = 0;
            });

            bubble.appendChild(button);
            projectLayer.appendChild(bubble);

            // When its rise began, to put it back in step after it's been stopped (see resyncBubble)
            if (!reduceMotion) {
                const rise = bubble.getAnimations().find((a) => a.animationName === 'project-rise');
                rise?.ready.then(() => { bubble.riseStart = rise.startTime; });
            }
        });

        // Bubbles pop when they bump into a fish or reach the top of the bowl
        function circleHitsRect(cx, cy, radius, rect) {
            // Shrink the fish box a little since the body is a pointed polygon
            const insetX = rect.width * 0.15;
            const insetY = rect.height * 0.2;
            const nearestX = Math.max(rect.left + insetX, Math.min(cx, rect.right - insetX));
            const nearestY = Math.max(rect.top + insetY, Math.min(cy, rect.bottom - insetY));
            return Math.hypot(cx - nearestX, cy - nearestY) < radius;
        }

        // A stopped bubble falls behind its place in the procession. Once it has popped and is out of sight,
        // move it back into step, staying within its current pass so it still comes back from the bottom.
        function resyncBubble(bubble) {
            const rise = bubble.getAnimations().find((a) => a.animationName === 'project-rise');
            if (!rise || rise.startTime === null || bubble.riseStart == null) return;
            const period = riseDuration * 1000;
            const behind = (((rise.startTime - bubble.riseStart) % period) + period) % period;
            if (behind < 5 || behind > period - 5) return;
            const into = (((rise.currentTime - rise.effect.getTiming().delay) % period) + period) % period;
            rise.currentTime += into + behind < period ? behind : behind - period;
        }

        let lastFrame = null;

        // Each frame: read all positions first, then steer the fish and pop anything that collided
        function tick(now) {
            const dt = Math.min(0.05, ((now - (lastFrame ?? now)) / 1000) || 1 / 60);
            lastFrame = now;

            const bowlRect = bowl.getBoundingClientRect();
            const bowlX = bowlRect.left + bowlRect.width / 2;
            const bowlY = bowlRect.top + bowlRect.height / 2;
            const bowlRadius = bowlRect.width / 2;
            fishState.forEach((state, fish) => { state.pos = readFish(fish, state); });
            const fishRects = [...fishState.values()].map((state) => state.pos.box);
            const bubbles = [...document.querySelectorAll('.project-bubble:not(.popping, .waiting)')].map((el) => {
                const r = el.getBoundingClientRect();
                const stopped = el.matches(':hover, :focus-within'); // held still so someone can click it
                return { el, cx: r.left + r.width / 2, cy: r.top + r.height / 2, radius: r.width / 2, stopped, rise: stopped ? 0 : riseSpeed };
            });
            const popped = new Set();
            const pop = (b) => {
                if (popped.has(b)) return;
                popped.add(b);
                popBubble(b.el);
            };

            bubbles.forEach((b) => {
                // Leave a bubble alone while someone is about to click it
                if (b.stopped) return;

                // Only the upper half of the glass counts, so bubbles can enter from below
                const hitTop = b.cy < bowlY && Math.hypot(b.cx - bowlX, b.cy - bowlY) + b.radius >= bowlRadius;
                const hitFish = fishRects.some((fr) => circleHitsRect(b.cx, b.cy, b.radius, fr));
                if (hitTop || hitFish) pop(b);
            });

            // A bubble that rises into a stopped one pops. Two moving ones only touch once a stop has put one
            // out of step; then the lower one, the one rising into the other, pops.
            bubbles.forEach((a, i) => bubbles.slice(i + 1).forEach((b) => {
                if (popped.has(a) || popped.has(b) || Math.hypot(a.cx - b.cx, a.cy - b.cy) >= a.radius + b.radius) return;
                const loser = a.stopped ? b : b.stopped ? a : (a.cy > b.cy ? a : b);
                if (!loser.stopped) pop(loser);
            }));

            document.querySelectorAll('.project-bubble.popping').forEach((el) => {
                if (now - el.poppedAt > 300) resyncBubble(el); // once its pop has faded
            });

            steerFish(dt, now, bubbles.filter((b) => !popped.has(b)), bowlRect);
            requestAnimationFrame(tick);
        }

        if (!reduceMotion) requestAnimationFrame(tick);
    </script>
</body>
