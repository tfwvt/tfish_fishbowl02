<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tFish Int • Multi Media</title>
    <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="fonts/fonts.css" rel="stylesheet">
    <style>
        :root {
            --obsidian-deep: #020402;
            --stellar-green: #0a2e1c;
            --ethereal-green: #1a5c3d;
            --neon-accent: #4ade80;
            --grain-opacity: 0.04;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--obsidian-deep);
            color: #e0e0e0;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Stellar Grain Filter Overlay.
           A small seamless noise tile, repeated: drawing the noise once at full-window size was slow
           on load and on every window resize. */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: var(--grain-opacity);
            background: url("data:image/svg+xml,%3Csvg width='256' height='256' viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.144' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }

        /* Starfield Background */
        .starfield {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(1px 1px at 25% 35%, #fff 50%, transparent 50%),
                radial-gradient(1px 1px at 50% 10%, #fff 50%, transparent 50%),
                radial-gradient(2px 2px at 15% 85%, #4ade80 50%, transparent 50%),
                radial-gradient(1px 1px at 85% 45%, #fff 50%, transparent 50%),
                radial-gradient(1px 1px at 70% 70%, #fff 50%, transparent 50%);
            background-size: 400px 400px;
            /* 1px steps: a smooth sub-pixel drift made the browser redraw the whole window every frame */
            animation: drift 120s steps(50) infinite;
            opacity: 0.3;
        }

        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(-50px, -50px); }
        }

        /* UI Layout */
        .main-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .header {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.4em;
        }

        .header h1 {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--neon-accent);
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
        }

        /* The Fish Bowl */
        .aquarium-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
        }

        .bowl {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, var(--ethereal-green) 0%, var(--stellar-green) 40%, var(--obsidian-deep) 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                inset 0 0 80px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(10, 46, 28, 0.5),
                inset 0 20px 40px rgba(255, 255, 255, 0.05);
        }

        /* Glass Reflection */
        .bowl::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 30%;
            height: 20%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
            border-radius: 50% 40% 60% 30%;
            filter: blur(8px);
        }

        /* Aerator Bubbles */
        .aerator {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            bottom: 0;
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-500px) scale(1.5); opacity: 0; }
        }

        /* Project Bubbles */
        .project-layer {
            position: absolute;
            inset: 0;
            z-index: 4; /* behind the fish (5), above the aerator bubbles */
            pointer-events: none;
        }

        .project-bubble {
            position: absolute;
            bottom: -110px;
            width: var(--size, 88px);
            height: var(--size, 88px);
            margin-left: calc(var(--size, 88px) / -2);
            pointer-events: auto;
            animation: project-rise var(--dur, 16s) linear infinite backwards;
        }

        .project-bubble-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.35) 0 6%, rgba(255, 255, 255, 0.06) 22%, rgba(74, 222, 128, 0.08) 60%, rgba(74, 222, 128, 0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 0 18px rgba(74, 222, 128, 0.25), 0 0 12px rgba(74, 222, 128, 0.15);
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            line-height: 1.3;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
            appearance: none;
            animation: project-sway var(--sway, 3.5s) ease-in-out infinite alternate;
            transition: transform 0.25s ease, box-shadow 0.25s ease, color 0.25s ease, opacity 0.25s ease;
        }

        /* Hold still while hovered/focused so it's easy to click. Only that bubble stops: the rest keep
           rising, and one that rises into it pops. */
        .project-bubble:hover,
        .project-bubble:focus-within,
        .project-bubble:hover .project-bubble-inner,
        .project-bubble:focus-within .project-bubble-inner {
            animation-play-state: paused;
        }

        .project-bubble:hover .project-bubble-inner,
        .project-bubble:focus-within .project-bubble-inner {
            transform: scale(1.15);
            color: var(--neon-accent);
            box-shadow: inset 0 0 24px rgba(74, 222, 128, 0.4), 0 0 24px rgba(74, 222, 128, 0.45);
        }

        /* An invisible popped or still-waiting bubble must not count as hovered (it would stop) */
        .project-bubble.popping,
        .project-bubble.waiting {
            pointer-events: none;
        }

        .project-bubble.popping .project-bubble-inner {
            transform: scale(1.6);
            opacity: 0;
        }

        @keyframes project-rise {
            0% { transform: translateY(0); opacity: 0; }
            8% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(-640px); opacity: 0; }
        }

        @keyframes project-sway {
            from { translate: -10px 0; }
            to { translate: 10px 0; }
        }

        /* Fish shouldn't block clicks on bubbles */
        .fish-swim { pointer-events: none; }

        /* Project Detail: grows out of the clicked bubble to fill the bowl */
        .project-detail {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 70px 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, #1f6b47 0%, var(--stellar-green) 45%, #041009 100%);
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(74, 222, 128, 0.25);
            clip-path: circle(0 at 50% 50%);
            transition: clip-path 0.55s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .project-detail[hidden] { display: none; }

        /* The stats sit over the bottom of the bowl; get them out of the panel's way */
        .stats-overlay { transition: opacity 0.3s ease; }

        .main-stage:has(.project-detail.open) .stats-overlay {
            opacity: 0;
            pointer-events: none;
        }

        .project-detail-close {
            position: absolute;
            top: 24px;
            left: 50%;
            translate: -50% 0;
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
            cursor: pointer;
            transition: transform 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .project-detail-close:hover,
        .project-detail-close:focus-visible {
            transform: rotate(90deg);
            color: var(--neon-accent);
            border-color: var(--neon-accent);
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.4);
            outline: none;
        }

        .project-detail-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 320px;
            text-align: center;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .project-detail.open .project-detail-body {
            opacity: 1;
            transform: none;
            transition-delay: 0.25s;
        }

        .project-detail-kicker {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: var(--neon-accent);
            opacity: 0.8;
        }

        .project-detail-title {
            font-size: 1.9rem;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.01em;
            background: linear-gradient(120deg, #fff 0%, #bbf7d0 45%, var(--neon-accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(74, 222, 128, 0.35));
        }

        .project-detail-desc {
            font-size: 0.78rem;
            font-weight: 300;
            line-height: 1.55;
            color: rgba(224, 224, 224, 0.75);
        }

        .project-detail-frame {
            width: 260px;
            margin-top: 4px;
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(74, 222, 128, 0.08);
        }

        .project-detail-frame img {
            display: block;
            width: 100%;
            aspect-ratio: 13 / 7;
            object-fit: cover;
            border-radius: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            .project-detail,
            .project-detail-body { transition: none; }
        }

        /* Cartoon Triggerfish.
           .fish-swim carries the swim keyframes; .fish inside it is tilted and nudged from JS
           (swerving round bubbles, darting from pops) through translate/rotate. Keeping the two
           apart lets the compositor run the swim without waiting on the page's script. */
        .fish-swim {
            position: absolute;
            width: 80px;
            height: 50px;
            z-index: 5;
        }

        .fish {
            position: relative;
            width: 100%;
            height: 100%;
            will-change: transform; /* its own layer, so the per-frame tilt doesn't repaint anything */
        }

        .fish-body {
            position: relative;
            width: 100%;
            height: 100%;
            background: #eab308; /* Cartoon yellow triggerfish base */
            clip-path: polygon(0% 50%, 20% 0%, 80% 10%, 100% 50%, 80% 90%, 20% 100%);
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.3);
        }

        .fish-body::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 15%;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            border: 2px solid white;
        }

        .fish-stripe {
            position: absolute;
            top: 0;
            left: 30%;
            width: 15px;
            height: 100%;
            background: #000;
            opacity: 0.2;
            transform: skewX(-20deg);
        }

        .fin {
            position: absolute;
            background: #ca8a04;
            width: 20px;
            height: 25px;
            left: 10px;
            top: -10px;
            clip-path: polygon(0 100%, 100% 0, 100% 100%);
        }

        .tail {
            position: absolute;
            right: -15px;
            top: 12px;
            width: 25px;
            height: 25px;
            background: #ca8a04;
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
        }

        /* Animations for specific fish. They animate only `transform`, which the browser can run
           off the main thread; animating left/top would need a layout on every frame.
           The fish are drawn facing left; a negative x scale turns one to face right, so each swim
           flips the fish whenever it heads right and it always swims head-first. The yellow (1) and
           blue (3) fish are drawn at 85% and the red (2) at 70%. The 51% step
           sits 1/50 of the way along the return leg, so the path doesn't hitch during the flip. */
        .fish-1 { top: 30%; left: -100px; animation: swim1 18s linear infinite; }
        .fish-2 { top: 60%; left: -100px; animation: swim2 24s linear infinite 2s; }
        .fish-3 { top: 45%; right: -100px; animation: swim3 21s linear infinite 5s; }

        @keyframes swim1 {
            0% { transform: translate(0, 0) scale(-0.85, 0.85); }
            50% { transform: translate(650px, 10px) scale(-0.85, 0.85); }
            51% { transform: translate(637px, 9.8px) scale(0.85); }
            100% { transform: translate(0, 0) scale(0.85); }
        }

        @keyframes swim2 {
            0% { transform: translateX(0) scale(-0.7, 0.7); }
            100% { transform: translateX(650px) scale(-0.7, 0.7); }
        }

        @keyframes swim3 {
            0% { transform: translate(0, 0) scale(0.85); }
            50% { transform: translate(-650px, 30px) scale(0.85); }
            51% { transform: translate(-637px, 29.4px) scale(-0.85, 0.85); }
            100% { transform: translate(0, 0) scale(-0.85, 0.85); }
        }

        /* 3D Picasso triggerfish. Its body is a stack of body-shaped slices, each a little smaller towards the
           outside, capped on both sides by a painted face, so it has real thickness: it rocks as it swims, and
           turns round by spinning about its spine (rotateY) instead of flipping. The swim keyframes still leave
           matrix.a negative while it faces right, so the steering reads it like the flat fish. Like a real
           triggerfish it ripples its rear dorsal and anal fins; JS builds the slices and the fin segments. */
        .fish-4 {
            top: 64%;
            left: 0;
            width: 96px;
            height: 64px;
            /* Swims in from off the right edge (swim4-enter), then loops back and forth inside the bowl (swim4),
               starting just as the entry ends, where the entry leaves it */
            animation: swim4-enter 5.7s linear, swim4 28s linear 5.7s infinite;
        }

        .trigger3d,
        .trigger3d .fish,
        .tf-model,
        .tf-pec-wrap {
            transform-style: preserve-3d;
        }

        .tf-model {
            position: absolute;
            inset: 0;
            animation: tf-rock 3.4s ease-in-out infinite alternate;
        }

        .tf-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 96px;
            height: 64px;
        }

        .tf-face svg { display: block; }

        .tf-tail {
            transform-origin: 76px 33px;
            animation: tf-wag 1.1s ease-in-out infinite alternate;
        }

        .tf-fin-seg {
            transform-origin: var(--ox) var(--oy);
            animation: tf-ripple 1.1s ease-in-out var(--delay) infinite alternate;
        }

        .tf-pec {
            transform-origin: 31px 39px;
            animation: tf-flutter 0.8s ease-in-out var(--delay, 0s) infinite alternate;
        }

        /* Stays in the bowl: swims across, slows and spins round near the glass, and swims back. It keeps
           spinning the same way, so the second turn takes it from 180° to 360°, which loops back to 0°.
           Each leg across takes 10s and each turn about 4s. It's drawn at 62.5% of the 96×64 model (scale3d, so
           it's thinner too); the steering reads that scale off the transform, as it does for the smaller red fish. */
        @keyframes swim4 {
            0% { transform: perspective(700px) translate(354px, 0) rotateY(0deg) scale3d(0.625, 0.625, 0.625); }
            36% { transform: perspective(700px) translate(62px, -14px) rotateY(0deg) scale3d(0.625, 0.625, 0.625); animation-timing-function: ease-in-out; }
            50% { transform: perspective(700px) translate(44px, 4px) rotateY(180deg) scale3d(0.625, 0.625, 0.625); }
            86% { transform: perspective(700px) translate(336px, 12px) rotateY(180deg) scale3d(0.625, 0.625, 0.625); animation-timing-function: ease-in-out; }
            100% { transform: perspective(700px) translate(354px, 0) rotateY(360deg) scale3d(0.625, 0.625, 0.625); }
        }

        /* From just off the right edge to where swim4 starts, at the same speed as its legs across (29px/s) */
        @keyframes swim4-enter {
            from { transform: perspective(700px) translate(520px, 0) rotateY(0deg) scale3d(0.625, 0.625, 0.625); }
            to { transform: perspective(700px) translate(354px, 0) rotateY(0deg) scale3d(0.625, 0.625, 0.625); }
        }

        @keyframes tf-rock {
            from { transform: rotateY(-18deg) rotateX(5deg); }
            to { transform: rotateY(18deg) rotateX(-4deg); }
        }

        @keyframes tf-wag {
            from { transform: rotateY(-24deg); }
            to { transform: rotateY(24deg); }
        }

        @keyframes tf-ripple {
            from { transform: rotate(var(--phi)) scaleY(0.7) rotate(calc(-1 * var(--phi))); }
            to { transform: rotate(var(--phi)) scaleY(1.12) rotate(calc(-1 * var(--phi))); }
        }

        @keyframes tf-flutter {
            from { transform: translateZ(var(--z)) rotateY(calc(var(--side) * -15deg)); }
            to { transform: translateZ(var(--z)) rotateY(calc(var(--side) * -60deg)); }
        }

        @media (prefers-reduced-motion: reduce) {
            .tf-model, .tf-tail, .tf-fin-seg, .tf-pec { animation: none; }
            .tf-pec { transform: translateZ(var(--z)) rotateY(calc(var(--side) * -30deg)); }
        }

        /* School of minnows. JS swims .school about the bowl (its origin is the school's centre) and turns
           it round at the glass and at bubbles. Each minnow flips after its own --lag, front first, so a
           turn ripples back through the school, and bobs on its own loop. Drawn facing left, like the fish. */
        .school {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 5; /* with the fish; added before them, so it swims behind them */
            pointer-events: none;
            will-change: transform;
        }

        .minnow {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: 16px;
            height: 8px;
            margin: -4px 0 0 -8px;
            transform: scaleX(1);
            /* --squeeze draws each minnow toward the middle: the school bunches up while it's dodging a bubble */
            translate: calc(var(--x) * var(--squeeze, 0)) calc(var(--y) * var(--squeeze, 0));
            transition: transform 0.3s ease var(--lag, 0s), translate 0.4s ease;
        }

        .school.facing-right .minnow { transform: scaleX(-1); }
        .school.wary { --squeeze: -0.3; }

        .minnow-body {
            position: relative;
            width: 100%;
            height: 100%;
            animation: minnow-bob var(--bob, 1.4s) ease-in-out var(--phase, 0s) infinite alternate;
        }

        .minnow-body::before { /* body, with its eye */
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 12px;
            height: 8px;
            background:
                radial-gradient(circle at 3px 3px, #0f172a 0 1.1px, transparent 1.4px),
                linear-gradient(#f1f5f9, #94a3b8);
            clip-path: polygon(0 50%, 30% 0, 100% 25%, 100% 75%, 30% 100%);
        }

        .minnow-body::after { /* tail */
            content: '';
            position: absolute;
            left: 11px;
            top: 1px;
            width: 5px;
            height: 6px;
            background: #94a3b8;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
        }

        @keyframes minnow-bob {
            from { translate: 0 -1.5px; }
            to { translate: 0 1.5px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .minnow-body { animation: none; }
        }

        /* Data Overlay */
        .stats-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            /* Text is dimmed per colour rather than with opacity, so the backing panels stay solid enough
               to read over the bubbles rising behind them */
            color: rgba(74, 222, 128, 0.7);
            z-index: 5;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 4.5rem;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            background: rgba(2, 4, 2, 0.35);
            border: 1px solid rgba(134, 239, 172, 0.25);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }

        /* The readouts are buttons that turn the creatures on and off: oxygen the big fish, depth the school
           and temp the 3D triggerfish */
        button.stat-item {
            font: inherit;
            color: inherit;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        button.stat-item:hover {
            border-color: rgba(134, 239, 172, 0.5);
            background-color: rgba(2, 4, 2, 0.45);
        }

        /* Switched on: a bright green rim with a soft glow, a green-tinted inside and a full-strength label, so
           it's plain which creatures are on. Hover brightens it a little more. */
        button.stat-item[aria-pressed="true"] {
            border-color: rgba(74, 222, 128, 0.75);
            background-color: rgba(10, 46, 28, 0.45);
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.3), inset 0 0 8px rgba(74, 222, 128, 0.15);
        }

        button.stat-item[aria-pressed="true"]:hover {
            border-color: rgba(74, 222, 128, 0.95);
        }

        button.stat-item[aria-pressed="true"] .stat-label {
            color: var(--neon-accent);
        }

        button.stat-item:focus-visible {
            outline: 2px solid var(--neon-accent);
            outline-offset: 2px;
        }

        /* Drop the middle readout by half its height, so its top lines up with the others' centres */
        .stat-depth {
            transform: translateY(50%);
        }

        .stat-value {
            font-weight: 700;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
        }

        /* Etched along the outside of the glass: an arc 17px out from the bowl's right edge (r = 250 + 17) */
        .etching-label {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
            fill: currentColor;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            opacity: 0.3;
            letter-spacing: 0.8em;
        }
    </style>
</head>
<body>

    <div class="grain-overlay"></div>
    <div class="starfield"></div>

    <main class="main-stage">
        <header class="header">
            <h1>tFish Int • Multi Media</h1>
        </header>

        <div class="aquarium-wrapper">
            <div class="bowl">
                <!-- Aerator Bubbles Spawner -->
                <div class="aerator" id="bubble-container"></div>

                <!-- Project Bubbles + detail panel -->
                <div class="project-layer" id="project-layer"></div>

                <div class="project-detail" id="project-detail" role="dialog" aria-labelledby="project-detail-title" hidden>
                    <button class="project-detail-close" type="button" aria-label="Close">
                        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                            <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <div class="project-detail-body">
                        <span class="project-detail-kicker"></span>
                        <h2 class="project-detail-title" id="project-detail-title"></h2>
                        <p class="project-detail-desc"></p>
                        <div class="project-detail-frame"><img alt=""></div>
                    </div>
                </div>
                
                <!-- The creatures in the bowl. Each sits in a template, whose contents aren't rendered, and the script
                     adds the ones switched on in `show` (see the script), so one that's off takes no CPU. -->
                <template id="fish-template">
                    <!-- Fish 1 -->
                    <div class="fish-swim fish-1">
                        <div class="fish">
                            <div class="fin"></div>
                            <div class="fish-body">
                                <div class="fish-stripe"></div>
                            </div>
                            <div class="tail"></div>
                        </div>
                    </div>

                    <!-- Fish 2 -->
                    <div class="fish-swim fish-2">
                        <div class="fish">
                            <div class="fin" style="background: #ef4444;"></div>
                            <div class="fish-body" style="background: #f87171;">
                                <div class="fish-stripe"></div>
                            </div>
                            <div class="tail" style="background: #ef4444;"></div>
                        </div>
                    </div>

                    <!-- Fish 3 -->
                    <div class="fish-swim fish-3">
                        <div class="fish">
                            <div class="fin" style="background: #3b82f6;"></div>
                            <div class="fish-body" style="background: #60a5fa;">
                                <div class="fish-stripe"></div>
                            </div>
                            <div class="tail" style="background: #3b82f6;"></div>
                        </div>
                    </div>
                </template>

                <!-- Fish 4: 3D triggerfish, built by buildTriggerfish() -->
                <template id="triggerfish-template">
                    <div class="fish-swim fish-4 trigger3d">
                        <div class="fish">
                            <div class="tf-model"></div>
                        </div>
                    </div>
                </template>
            </div>
            <svg class="etching-label" viewBox="0 0 500 500">
                <!-- Clockwise from the top of the bowl to the bottom, so the letters stand with their tops outward -->
                <path id="etching-arc" d="M 250 -17 A 267 267 0 0 1 250 517" fill="none"/>
                <text dominant-baseline="central"><textPath href="#etching-arc" startOffset="50%" text-anchor="middle">media solve web</textPath></text>
            </svg>
        </div>

        <div class="stats-overlay">
            <button class="stat-item" id="fish-toggle" type="button" aria-pressed="true" title="Turn the fish on or off">
                <span class="stat-label">OXYGEN</span>
                <span class="stat-value">98.2%</span>
            </button>
            <button class="stat-item stat-depth" id="school-toggle" type="button" aria-pressed="false" title="Turn the school of fish on or off">
                <span class="stat-label">DEPTH</span>
                <span class="stat-value">2ft</span>
            </button>
            <button class="stat-item" id="triggerfish-toggle" type="button" aria-pressed="false" title="Turn the 3D fish on or off">
                <span class="stat-label">TEMP</span>
                <span class="stat-value">72°F</span>
            </button>
        </div>
    </main>

    <script>
        const bubbleContainer = document.getElementById('bubble-container');
        const bubbleCount = 20;

        for (let i = 0; i < bubbleCount; i++) {
            createBubble();
        }

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const size = Math.random() * 8 + 4;
            const left = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 5;

            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${left}%`;
            bubble.style.animationDuration = `${duration}s`;
            bubble.style.animationDelay = `${delay}s`;

            bubbleContainer.appendChild(bubble);

            // Recycle bubble
            bubble.addEventListener('animationiteration', () => {
                bubble.style.left = `${Math.random() * 100}%`;
            });
        }

        // Edit this list: one bubble per project. Swap `image` for a real path like 'img/project-one.jpg'
        const placeholderText = 'A short description of this project: what it is, who it was for and what you made. Replace this with a sentence or two about the work.';
        const projects = [
            { title: 'Project One', description: placeholderText, image: placeholderImage('Project One', 150) },
            { title: 'Project Two', description: placeholderText, image: placeholderImage('Project Two', 190) },
            { title: 'Project Three', description: placeholderText, image: placeholderImage('Project Three', 45) },
            { title: 'Project Four', description: placeholderText, image: placeholderImage('Project Four', 280) },
            { title: 'Project Five', description: placeholderText, image: placeholderImage('Project Five', 330) },
            { title: 'Project Six', description: placeholderText, image: placeholderImage('Project Six', 15) },
            { title: 'Project Seven', description: placeholderText, image: placeholderImage('Project Seven', 100) },
            { title: 'Project Eight', description: placeholderText, image: placeholderImage('Project Eight', 230) },
        ];

        // Simple generated landscape so each project has an image until real ones are added
        function placeholderImage(label, hue) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280">
                <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="hsl(${hue},45%,30%)"/><stop offset="1" stop-color="hsl(${hue},55%,10%)"/>
                </linearGradient></defs>
                <rect width="520" height="280" fill="url(#g)"/>
                <circle cx="390" cy="85" r="34" fill="hsl(${hue},70%,75%)" opacity="0.8"/>
                <path d="M0 280L140 140L230 220L320 120L520 280Z" fill="hsl(${hue},40%,18%)"/>
                <text x="24" y="44" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="16" letter-spacing="4">${label.toUpperCase()}</text>
            </svg>`;
            return `data:image/svg+xml,${encodeURIComponent(svg)}`;
        }

        const projectLayer = document.getElementById('project-layer');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const riseDuration = 16;
        const startleGap = 40; // px from the popped bubble's edge to a fish's body for that fish to dart away

        // Build the 3D triggerfish inside a .tf-model. Everything is drawn in a 96×64 box, facing left like the
        // flat fish. z is towards the viewer; the fish is 16px thick.
        function buildTriggerfish(model) {
            const body = 'M0,36 L9,27 C14,20 19,14 25,10 C31,6 37,5 42,6 C52,8 63,15 74,26 L78,29 L78,37 L74,40 '
                + 'C64,50 52,57 42,59 C31,60 19,55 11,47 L0,37.5 Z';
            const layer = (cls, transform, style = '') => {
                const el = document.createElement('div');
                el.className = `tf-layer ${cls}`;
                if (transform) el.style.transform = transform;
                el.style.cssText += style;
                model.appendChild(el);
                return el;
            };
            const centre = 'transform-origin: 40px 33px;';
            const thick = 8; // half thickness
            // The body narrows towards each face, more in height than length, like a laterally flattened fish
            const squash = (z) => {
                const k = Math.sqrt(1 - (z / (thick + 1)) ** 2);
                return `scale(${(0.86 + 0.14 * k).toFixed(3)}, ${(0.78 + 0.22 * k).toFixed(3)})`;
            };
            const shade = (rgb, f) => `rgb(${rgb.map((c) => Math.round(c * f)).join(',')})`;

            // Fins in the middle plane, behind the slices: the body hides their roots
            const tailEl = layer('tf-tail', '', `clip-path: path('M75,30 L90,21 C94,27 95,39 90,45 L75,36 Z');
                background: linear-gradient(90deg, #1d4ed8 79%, #06b6d4 87%, #facc15 96%); /* stops sit where the tail is in the 96px box */`);
            tailEl.setAttribute('aria-hidden', 'true');
            layer('', '', `clip-path: path('M36,8 L41,-3 L43.5,-2 L41,8 Z'); background: #e11d48;`); // the "trigger" spine

            // Rear dorsal and anal fins: strips along the body's edge (a cubic) that each stretch out from their
            // root and back, a little behind the one in front, so a wave runs back along the fin. The stretch stays
            // in the fin's plane: strips rocking out of it would cut through the body slices, which costs the
            // compositor far more than the rest of the fish put together.
            const bez = ([p0, p1, p2, p3], t) => {
                const u = 1 - t;
                return [0, 1].map((i) => u ** 3 * p0[i] + 3 * u * u * t * p1[i] + 3 * u * t * t * p2[i] + t ** 3 * p3[i]);
            };
            const fin = (curve, outward, height, colour) => {
                const n = 12, t0 = 0.1;
                const ts = Array.from({ length: n + 1 }, (_, i) => t0 + (1 - t0) * i / n);
                const edge = ts.map((t) => {
                    const [x, y] = bez(curve, t);
                    const [x2, y2] = bez(curve, Math.min(1, t + 0.01));
                    const [x1, y1] = bez(curve, Math.max(0, t - 0.01));
                    const len = Math.hypot(x2 - x1, y2 - y1);
                    const nx = outward * (y2 - y1) / len, ny = -outward * (x2 - x1) / len;
                    const h = height(t);
                    return { root: [x - nx * 2, y - ny * 2], tip: [x + nx * h, y + ny * h] };
                });
                for (let i = 0; i < n; i++) {
                    // Each strip overlaps the next a little, so no gaps open between them as they rock
                    const a = edge[i], b = edge[Math.min(n, i + 1)];
                    const over = (p, q) => [q[0] + (q[0] - p[0]) * 0.25, q[1] + (q[1] - p[1]) * 0.25];
                    const pts = [a.root, over(a.root, b.root), over(a.tip, b.tip), a.tip].map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`);
                    const dx = b.root[0] - a.root[0], dy = b.root[1] - a.root[1];
                    const seg = layer('tf-fin-seg', '', `clip-path: polygon(${pts.join(',')}); background: ${colour};`);
                    seg.style.setProperty('--ox', `${((a.root[0] + b.root[0]) / 2).toFixed(1)}px`);
                    seg.style.setProperty('--oy', `${((a.root[1] + b.root[1]) / 2).toFixed(1)}px`);
                    seg.style.setProperty('--phi', `${(Math.atan2(dy, dx) * 180 / Math.PI).toFixed(1)}deg`);
                    seg.style.setProperty('--delay', `${(-1.1 + i * 0.1).toFixed(2)}s`);
                }
            };
            // Blue-tipped on the back, pink-tipped underneath, gold at the roots
            const finColour = 'linear-gradient(180deg, rgba(56,189,248,0.9), rgba(250,204,21,0.9) 35% 65%, rgba(236,72,153,0.9))';
            fin([[42, 6], [52, 8], [63, 15], [74, 26]], 1, (t) => 1.5 + 9 * (1 - t) ** 1.3, finColour);
            fin([[42, 59], [52, 57], [64, 50], [74, 40]], -1, (t) => 1.5 + 8 * (1 - t) ** 1.3, finColour);

            // Slices, darker towards the middle so the rim reads as the rounded side of the body
            for (const z of [-6.75, -5.25, -3.75, -2.25, -0.75, 0.75, 2.25, 3.75, 5.25, 6.75]) {
                const f = 0.55 + 0.4 * Math.abs(z) / thick;
                layer('', `translateZ(${z}px) ${squash(z)}`, `${centre} clip-path: path('${body}');
                    background: linear-gradient(180deg, ${shade([245, 166, 35], f)}, ${shade([253, 222, 140], f)} 60%, ${shade([253, 176, 120], f)});`);
            }

            // The painted sides: amber back, cream belly, orange lip line, a turquoise mask with blue, teal and
            // black bands through the eye, a red spot at the fin, an indigo saddle with yellow and cyan stripes,
            // and crimson barbs on the tail stalk
            const face = `<svg width="96" height="64" viewBox="0 0 96 64" aria-hidden="true">
                <defs>
                    <linearGradient id="tf-base" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#f59e0b"/><stop offset="0.4" stop-color="#fcd34d"/><stop offset="0.72" stop-color="#fff1d6"/><stop offset="1" stop-color="#fdba74"/>
                    </linearGradient>
                    <radialGradient id="tf-gloss" cx="0.36" cy="0.3" r="0.55">
                        <stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
                    </radialGradient>
                    <radialGradient id="tf-shadow" cx="0.45" cy="0.4" r="0.62">
                        <stop offset="0.7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/>
                    </radialGradient>
                </defs>
                <rect width="96" height="64" fill="url(#tf-base)"/>
                <path d="M30,6 L45,6 L44,40 L36,44 L27,38 Z" fill="#22d3ee" opacity="0.5"/>
                <g stroke-linecap="round" fill="none">
                    <path d="M27,9 L34,39" stroke="#3b82f6" stroke-width="1.8"/>
                    <path d="M31,7.5 L37.5,38" stroke="#161616" stroke-width="2.2"/>
                    <path d="M35,7 L41,36" stroke="#0d9488" stroke-width="1.8"/>
                    <path d="M39,6.5 L44,33" stroke="#161616" stroke-width="1.4"/>
                    <path d="M1,36.5 C10,37.5 20,38 31,39" stroke="#f97316" stroke-width="2.4"/>
                    <path d="M4,33 C12,31 19,30 26,27" stroke="#3b82f6" stroke-width="1.3"/>
                </g>
                <ellipse cx="32" cy="40" rx="3.5" ry="2.4" fill="#ef4444"/>
                <path d="M33,46 C44,37 58,31 76,28 L76,39 C64,49 52,56 41,59 Z" fill="#312e81"/>
                <g stroke-width="1.6" stroke-linecap="round">
                    <path d="M48,55 L57,40" stroke="#fde047"/><path d="M54,52 L62,38" stroke="#67e8f9"/><path d="M60,48 L67,36" stroke="#fde047"/>
                </g>
                <g stroke="#be123c" stroke-width="1.4" stroke-linecap="round">
                    <path d="M69,31 L75,32"/><path d="M69,34 L76,34.5"/><path d="M69,37 L75,36.5"/>
                </g>
                <circle cx="31" cy="20" r="4.2" fill="#1e1b4b"/>
                <circle cx="31" cy="20" r="3.1" fill="#f97316"/>
                <circle cx="31" cy="20" r="1.8" fill="#050505"/>
                <circle cx="30" cy="19" r="0.8" fill="#fff"/>
                <rect width="96" height="64" fill="url(#tf-shadow)"/>
                <rect width="96" height="64" fill="url(#tf-gloss)"/>
            </svg>`;
            for (const side of [1, -1]) {
                const el = layer('tf-face', `translateZ(${side * thick}px) ${squash(thick - 0.5)}`, `${centre} clip-path: path('${body}');`);
                el.innerHTML = face;
            }
            // Only one face's SVG may own the ids; the other reuses them
            const second = model.querySelectorAll('.tf-face svg')[1];
            second.querySelector('defs').remove();

            // Pectoral fins, just outside each face behind the gill, fanning in and out
            for (const side of [1, -1]) {
                const pec = layer('tf-pec', '', `clip-path: path('M30,37 L41,32 C44,36 44,42 41,46 L30,41 Z');
                    background: linear-gradient(90deg, rgba(249,115,22,0.95), rgba(250,204,21,0.8));`);
                pec.style.setProperty('--z', `${side * (thick + 0.6)}px`);
                pec.style.setProperty('--side', side);
                pec.style.setProperty('--delay', side > 0 ? '0s' : '-0.4s');
            }
        }
        // Which creatures are in the bowl. Change the defaults here, or override them from the page's address
        // without changing the file: ?school or ?school=1 turns one on, ?fish=0 turns one off. One that's off is
        // never added to the page or steered, so it takes no CPU.
        //   fish: the three flat fish; a click on the oxygen readout turns them on and off (see setFish)
        //   school: the school of minnows; a click on the depth readout turns it on and off (see setSchool)
        //   triggerfish: the 3D triggerfish, off as it made the whole animation choppy and needs more work; a click
        //     on the temp readout turns it on and off (see setTriggerfish)
        const params = new URLSearchParams(location.search);
        const toggle = (name, on) => (params.has(name) ? !['0', 'false', 'off', 'no'].includes(params.get(name)) : on);
        const show = {
            fish: toggle('fish', true),
            school: toggle('school', false),
            triggerfish: toggle('triggerfish', false),
        };
        // The creatures can be turned on and off while the page runs (see setFish, setTriggerfish and setSchool),
        // so their templates stay put and each is added just before its own
        const fishTemplate = document.getElementById('fish-template');
        const fishToggle = document.getElementById('fish-toggle');
        const triggerfishTemplate = document.getElementById('triggerfish-template');
        const triggerfishToggle = document.getElementById('triggerfish-toggle');

        // Per-fish steering state: a swerve around bubbles plus an optional startle dart.
        // The swim keyframes move, turn and scale each fish's .fish-swim wrapper; the steering
        // nudges and tilts the .fish inside it.
        const fishState = new Map();
        function addFishState(fish) {
            fishState.set(fish, {
                swim: fish.parentElement,
                width: fish.offsetWidth,
                height: fish.offsetHeight,
                pos: null, // where it's drawn this frame, from readFish
                trackY: 0, // how far startles have moved the fish's track up or down from its swim path
                plan: [], planStart: 0, planAge: Infinity, // the swerve it's following, and when it started
                avoidY: 0, vy: 0, tilt: 0, dir: 1, speed: 0, lastX: null, dart: null,
                applied: { x: 0, y: 0 }, // the on-screen offset set last frame, taken back off the measured position
            });
        }

        // Turn the big fish on or off. Off, they're taken out of the page and out of the steering, so they take no
        // CPU; back on, they start their swims afresh from off the edge of the bowl.
        function setFish(on) {
            show.fish = on;
            fishToggle.setAttribute('aria-pressed', String(on));
            const added = fishTemplate.parentElement.querySelectorAll('.fish-swim:not(.fish-4)');
            if (on && !added.length) {
                const fish = fishTemplate.content.cloneNode(true);
                const swims = [...fish.querySelectorAll('.fish-swim')];
                fishTemplate.before(fish);
                swims.forEach((swim) => addFishState(swim.querySelector('.fish')));
            } else if (!on) {
                added.forEach((swim) => {
                    fishState.delete(swim.querySelector('.fish'));
                    swim.remove();
                });
            }
        }
        setFish(show.fish);
        fishToggle.addEventListener('click', () => setFish(!show.fish));

        // Turn the 3D triggerfish on or off; a click on the temp readout does this. Off, it's taken out of the page
        // and out of the steering, so it takes no CPU. Back on, it's built afresh and swims in from off the edge
        // like the other fish (swim4-enter), then carries on back and forth inside the bowl.
        function setTriggerfish(on) {
            show.triggerfish = on;
            triggerfishToggle.setAttribute('aria-pressed', String(on));
            const added = document.querySelector('.fish-4');
            if (on && !added) {
                const fish = triggerfishTemplate.content.cloneNode(true);
                const swim = fish.querySelector('.fish-swim');
                buildTriggerfish(swim.querySelector('.tf-model'));
                triggerfishTemplate.before(fish);
                addFishState(swim.querySelector('.fish'));
            } else if (!on && added) {
                fishState.delete(added.querySelector('.fish'));
                added.remove();
            }
        }
        setTriggerfish(show.triggerfish);
        triggerfishToggle.addEventListener('click', () => setTriggerfish(!show.triggerfish));
        const relaxSpeed = 35;  // px/s it drifts back to its track
        const steerAccel = 300; // px/s² a swerve can speed up, slow down or reverse, so changes of course ease in and out
        const riseSpeed = 640 / riseDuration; // px/s, matches the project-rise keyframes

        // Swerve planning. A swerve is a list of [speed, seconds] stages (up is -), then a drift back to the
        // track. A few times a second each fish plays some swerves a few seconds ahead against where every
        // bubble will have risen to, and follows the gentlest one that gets past them all.
        const planEvery = 0.08;  // s between re-plans
        const planHorizon = 4.5; // s each swerve is played ahead
        const planStep = 0.1;    // s between checks along a swerve
        const planSpeeds = [-90, -60, -40, -20, 0, 20, 40, 60, 90]; // px/s
        // One-stage swerves, tried every time
        const simpleSwerves = [0.8, 1.6, planHorizon].flatMap((d) => planSpeeds.map((v) => [[v, d]]));
        // Two-stage swerves, to thread one gap and then the next; only searched when nothing simpler gets
        // through, gentlest first
        const swerveEffort = (stages) => stages.reduce((sum, [v, d]) => sum + Math.abs(v) * Math.min(d, 2), 0);
        const twoStageSwerves = [0.4, 0.8, 1.5, 2.5].flatMap((d1) => planSpeeds.flatMap((v1) =>
            [0.8, 1.6, 3].flatMap((d2) => planSpeeds.map((v2) => [[v1, d1], [v2, d2]]))))
            .sort((a, b) => swerveEffort(a) - swerveEffort(b));

        // Fish keep their centre within this part of the bowl's height, so swerves and darts stay in the water
        function waterLimits(bowlRect) {
            return [bowlRect.top + bowlRect.height * 0.16, bowlRect.top + bowlRect.height * 0.84];
        }
        // Slow a swerve as the fish nears the edge of the water, so it eases to a stop there rather than hitting it
        const edgeEase = 3; // 1/s
        function easeAtEdge(want, y, waterMin, waterMax) {
            return Math.max(-(y - waterMin) * edgeEase, Math.min((waterMax - y) * edgeEase, want));
        }
        // Startles move a fish's track, but only within the middle of the bowl. Every bubble rises right to the
        // top, so a fish pushed up there would have nowhere left to dodge.
        function trackLimits(bowlRect) {
            return [bowlRect.top + bowlRect.height * 0.25, bowlRect.top + bowlRect.height * 0.7];
        }

        // Read where a fish is drawn, once per frame, for both the bubble hit test and the steering:
        // its centre, which way it faces, its scale (the swim keyframes shrink one fish and mirror
        // them to turn) and an unrotated box, since tilting would inflate getBoundingClientRect.
        function readFish(fish, state) {
            const m = new DOMMatrixReadOnly(getComputedStyle(state.swim).transform);
            const r = fish.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            const scale = Math.abs(m.d) || 1; // only the x scale flips, so the y scale is the drawn size
            const w = state.width * scale / 2;
            const h = state.height * scale / 2;
            return {
                cx, cy, scale, scaleX: m.a, halfWidth: w, halfHeight: h,
                facing: m.a < 0 ? 1 : -1, // drawn facing left; mirrored = facing right
                box: { left: cx - w, right: cx + w, top: cy - h, bottom: cy + h, width: w * 2, height: h * 2 },
            };
        }
        const noOffset = { x: 0, y: 0, rot: 0 };

        const smoothstep = (k) => k * k * (3 - 2 * k);
        const mix = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, rot: a.rot + (b.rot - a.rot) * k });

        // Dart out over 0.35s, hold, then drift back over 1.8s
        function dartAt(d, now) {
            if (!d) return noOffset;
            const t = (now - d.start) / 1000;
            if (t < 0.35) return mix(d.from, d.to, smoothstep(t / 0.35));
            if (t < 0.7) return d.to;
            if (t < 2.5) return mix(d.to, noOffset, smoothstep((t - 0.7) / 1.8));
            return noOffset;
        }
        function dartOffset(state, now) {
            if (state.dart && now - state.dart.start >= 2500) state.dart = null;
            return dartAt(state.dart, now);
        }

        // When (in s) a fish swimming on at its speed first bumps a bubble, if it's at height ys[k] at time
        // (k + 1) * planStep; Infinity if it never does. The hit test, a few px wider, against each bubble
        // risen that much further (at its `rise` speed: 0 while someone has it stopped).
        function firstBump(state, fishX, ys, reachX, clearance, near) {
            const speed = Math.max(state.speed, 20);
            for (let k = 0; k < ys.length; k++) {
                const t = (k + 1) * planStep;
                const x = fishX + state.dir * speed * t;
                const y = ys[k];
                for (const { cx, cy, radius, rise } of near) {
                    const by = cy - rise * t;
                    const dx = cx - Math.max(x - reachX, Math.min(cx, x + reachX));
                    const dy = by - Math.max(y - clearance, Math.min(by, y + clearance));
                    if (dx * dx + dy * dy < (radius + 6) ** 2) return t;
                }
            }
            return Infinity;
        }

        // Fish near a popped bubble dart away from it, then settle only halfway back
        function startleFish(bubble) {
            if (reduceMotion) return;
            const now = performance.now();
            const pop = bubble.getBoundingClientRect();
            const popX = pop.left + pop.width / 2;
            const popY = pop.top + pop.height / 2;
            const popRadius = pop.width / 2;
            const others = [...document.querySelectorAll('.project-bubble:not(.popping, .waiting)')]
                .filter((b) => b !== bubble)
                .map((b) => {
                    const o = b.getBoundingClientRect();
                    const rise = b.matches(':hover, :focus-within') ? 0 : riseSpeed;
                    return { cx: o.left + o.width / 2, cy: o.top + o.height / 2, radius: o.width / 2, rise };
                });

            const bowlRect = bowl.getBoundingClientRect();
            const [waterMin, waterMax] = waterLimits(bowlRect);
            const [trackMin, trackMax] = trackLimits(bowlRect);

            fishState.forEach((state) => {
                if (!state.pos) return;
                const { box, cx: fishX, cy: fishY, halfWidth, halfHeight } = state.pos;
                // Only fish close to the bubble react: measure from its edge to the nearest point of the fish
                const nearestX = Math.max(box.left, Math.min(popX, box.right));
                const nearestY = Math.max(box.top, Math.min(popY, box.bottom));
                const gap = Math.max(0, Math.hypot(popX - nearestX, popY - nearestY) - popRadius);
                if (gap > startleGap) return;

                const dy = fishY - popY;
                let push = 30 + (1 - gap / startleGap) * 70; // closer = bigger dart
                // Flee straight up or down, away from the pop, and keep swimming forward. Fleeing
                // sideways would back the fish up tail-first when the pop is ahead of it, or on the drift back.
                const away = dy < 0 ? -1 : 1; // -1 = up
                push = Math.min(push, Math.max(0, away < 0 ? fishY - waterMin : waterMax - fishY)); // stay in the water

                // Nose points along the dart: up when fleeing upward, down when fleeing downward
                const tilt = state.dir * away * (8 + Math.random() * 8);
                // The fish's track moves by half the dart, so it drifts back only halfway. The dart is measured
                // from the new track, shifted so the fish doesn't jump.
                const pathY = fishY - state.applied.y;
                const current = dartOffset(state, now);
                const makeDart = (size) => {
                    const trackY = Math.max(trackMin - pathY, Math.min(trackMax - pathY, state.trackY + away * size / 2));
                    const shift = trackY - state.trackY;
                    const dart = { start: now, from: { ...current, y: current.y - shift }, to: { x: 0, y: away * size - shift, rot: tilt } };
                    // Where it takes the fish over the next 2s, to check against the other bubbles
                    const ys = Array.from({ length: 20 }, (_, k) =>
                        pathY + trackY + state.avoidY + dartAt(dart, now + (k + 1) * planStep * 1000).y);
                    return { trackY, dart, bumpAt: firstBump(state, fishX, ys, halfWidth * 0.7, halfHeight * 0.6, others) };
                };
                // The full dart if its path stays clear of the other bubbles, else the longest shorter one that
                // does, else whichever bumps latest
                const options = [1, 0.7, 0.5, 0.3, 0.15].map((k) => makeDart(push * k));
                const pick = options.find((o) => o.bumpAt === Infinity)
                    ?? options.reduce((a, b) => (b.bumpAt > a.bumpAt ? b : a));
                state.trackY = pick.trackY;
                state.dart = pick.dart;
            });
        }

        // Pick the swerve a fish should follow from now: a list of stages, empty to drift back to its track
        function planSwerve(state, now, fishX, fishY, baseY, reachX, clearance, bubbles, waterMin, waterMax) {
            const speed = Math.max(state.speed, 20);
            // Only bubbles the fish could reach within the horizon matter
            const near = bubbles.filter(({ cx, radius }) => {
                const ahead = (cx - fishX) * state.dir;
                return ahead > -(radius + reachX) && ahead < speed * planHorizon + radius + reachX;
            });
            if (!near.length) {
                state.bumpAt = Infinity;
                return [];
            }

            const relaxV = (y) => Math.max(-relaxSpeed, Math.min(relaxSpeed, (baseY - y) * 2));
            // A dart in progress carries on moving the fish, on top of the swerve
            const dartNow = dartAt(state.dart, now).y;
            const dartAhead = Array.from({ length: Math.round(planHorizon / planStep) }, (_, k) =>
                dartAt(state.dart, now + (k + 1) * planStep * 1000).y - dartNow);
            // Play a swerve ahead: when (if ever) it bumps a bubble, and how far off the track it strays
            const play = (stages) => {
                let y = fishY - dartNow, vel = state.vy, stray = 0;
                const ys = dartAhead.map((dart, k) => {
                    const t = (k + 1) * planStep;
                    let want = null;
                    for (let i = 0, end = 0; i < stages.length && want === null; i++) {
                        end += stages[i][1];
                        if (t <= end) want = stages[i][0];
                    }
                    const target = easeAtEdge(want ?? relaxV(y), y, waterMin, waterMax);
                    vel += Math.max(-steerAccel * planStep, Math.min(steerAccel * planStep, target - vel));
                    y = Math.max(waterMin, Math.min(waterMax, y + vel * planStep));
                    stray += Math.abs(y - baseY) * planStep;
                    return y + dartNow + dart;
                });
                return { stages, bumpAt: firstBump(state, fishX, ys, reachX, clearance, near), stray };
            };

            // Never bumping comes first, then a later bump over an earlier one; after that, stray little, swerve
            // gently, and stick with the current swerve rather than flip-flopping
            const firstSpeed = (stages) => (stages.length ? stages[0][0] : relaxV(fishY));
            const currentSpeed = firstSpeed(remainingStages(state, now));
            const cost = ({ stages, bumpAt, stray }) => (bumpAt < Infinity ? 1e4 + 1e3 * (planHorizon - bumpAt) : 0)
                + stray * 0.25 + swerveEffort(stages) * 0.5 + Math.abs(firstSpeed(stages) - currentSpeed) * 1.2;
            let best = [remainingStages(state, now), [], ...simpleSwerves]
                .map(play).reduce((a, b) => (cost(b) < cost(a) ? b : a));

            // Nothing simple gets through: look for a two-stage swerve that does (not too often, as it's slower)
            if (best.bumpAt < Infinity && now >= (state.searchAfter ?? 0)) {
                const threads = twoStageSwerves.find((stages) => play(stages).bumpAt === Infinity);
                if (threads) best = play(threads);
                else state.searchAfter = now + 400;
            }
            state.bumpAt = best.bumpAt;
            return best.stages;
        }

        // What's left of the swerve a fish is following, from now
        function remainingStages(state, now) {
            let elapsed = (now - state.planStart) / 1000;
            const left = [];
            for (const [v, d] of state.plan) {
                if (elapsed < d) left.push([v, d - elapsed]);
                elapsed = Math.max(0, elapsed - d);
            }
            return left;
        }

        // The 3D triggerfish's turns (swim4) are timed by its keyframes. If it touches a bubble in the first half
        // of a turn, it turns back the way it came once it's halfway round (playing the turn backwards), waits a
        // moment facing the glass, then tries the turn again. Only an actual touch turns it back (tick records
        // each fish's touches in touchedAt): with the bowl full of bubbles, turning back for any bubble that
        // was merely on its way kept it stuck at the glass.
        // Turns as fractions of a swim4 loop: when each starts and its halfway point.
        const triggerfishTurns = [{ start: 0.36, half: 0.43 }, { start: 0.86, half: 0.93 }];
        const turnRetryAfter = 800; // ms it waits facing the glass before trying the turn again
        function guardTriggerfishTurn(state, now) {
            const swim = state.swim.getAnimations().find((a) => a.animationName === 'swim4');
            if (!swim || !state.pos) return;
            const { progress, currentIteration } = swim.effect.getComputedTiming();
            if (progress === null) return; // still swimming in (swim4-enter)
            const turn = state.turn ??= { mode: 'swim', last: progress, touched: null };
            const timeAt = (p) => swim.effect.getTiming().delay + (currentIteration + p) * swim.effect.getTiming().duration;

            if (turn.mode === 'swim') {
                const firstHalf = triggerfishTurns.find((t) => progress >= t.start && progress < t.half);
                if (firstHalf && state.touchedAt === now) turn.touched = firstHalf;
                const reachedHalf = triggerfishTurns.find((t) => turn.last < t.half && progress >= t.half);
                if (reachedHalf) {
                    if (turn.touched === reachedHalf) {
                        turn.mode = 'back';
                        turn.at = reachedHalf;
                        swim.playbackRate = -1;
                    }
                    turn.touched = null;
                }
            } else if (turn.mode === 'back' && progress <= turn.at.start) {
                swim.pause();
                swim.currentTime = timeAt(turn.at.start);
                turn.mode = 'wait';
                turn.waitUntil = now + turnRetryAfter;
            } else if (turn.mode === 'wait' && now >= turn.waitUntil) {
                swim.playbackRate = 1;
                swim.play();
                turn.mode = 'swim';
            }
            turn.last = swim.effect.getComputedTiming().progress;
        }

        // Steer each fish round the bubbles ahead of it, swerving only as hard as it needs to
        function steerFish(dt, now, bubbles, bowlRect) {
            const [waterMin, waterMax] = waterLimits(bowlRect);
            fishState.forEach((state, fish) => {
                const { cx: fishX, cy: fishY, halfWidth, halfHeight, facing, scale, scaleX } = state.pos;
                const dart = dartOffset(state, now);
                // Where the swim keyframes alone put the fish (the measured centre minus the offset set last
                // frame), and its track: that path moved up or down by earlier startles
                const pathX = fishX - state.applied.x;
                const pathY = fishY - state.applied.y;
                const baseY = pathY + state.trackY;
                const vx = state.lastX === null ? 0 : (pathX - state.lastX) / dt;
                if (Math.abs(vx) < 1000) state.speed += (Math.abs(vx) - state.speed) * Math.min(1, dt * 4); // ignore loop jumps
                state.lastX = pathX;
                // Point the way the swim keyframes face the fish (mirrored = facing right), rather than
                // guessing from frame-to-frame movement, which darts and swerves throw off
                state.dir = facing;

                // Match the hit test's inset box (15% / 20% trimmed off each side)
                const reachX = halfWidth * 0.7;
                const clearance = halfHeight * 0.6;
                state.planAge += dt;
                if (state.planAge >= planEvery) {
                    state.planAge = 0;
                    state.plan = planSwerve(state, now, fishX, fishY, baseY, reachX, clearance, bubbles, waterMin, waterMax);
                    state.planStart = now;
                }

                // Swerve at the planned speed, letting it build up and ease off rather than snapping
                const stage = remainingStages(state, now)[0];
                const wantVy = easeAtEdge(stage ? stage[0] : Math.max(-relaxSpeed, Math.min(relaxSpeed, -state.avoidY * 2)),
                    baseY + state.avoidY, waterMin, waterMax);
                const accel = steerAccel * dt;
                state.vy += Math.max(-accel, Math.min(accel, wantVy - state.vy));
                state.avoidY += state.vy * dt;
                // Stay in the water (a backstop: the easing above normally stops it first)
                const low = waterMin - baseY, high = waterMax - baseY;
                if (state.avoidY < low || state.avoidY > high) {
                    state.avoidY = Math.max(low, Math.min(high, state.avoidY));
                    state.vy = 0;
                }

                // Nose follows the swerve: up when rising, down when diving
                const tiltTarget = Math.max(-25, Math.min(25,
                    state.dir * Math.atan2(state.vy, Math.max(state.speed, 40)) * 180 / Math.PI));
                // Turning the nose no faster than 60°/s keeps quick weaves between bubbles from reading as a wiggle
                const turn = (tiltTarget - state.tilt) * Math.min(1, dt * 4);
                state.tilt += Math.max(-60 * dt, Math.min(60 * dt, turn));

                // Worked out on screen, then set inside the wrapper: undo its scale, and mirror the
                // tilt when the fish is turned round
                state.applied = { x: dart.x, y: state.trackY + state.avoidY + dart.y };
                const localX = Math.abs(scaleX) > 0.05 ? state.applied.x / scaleX : 0;
                fish.style.translate = `${localX}px ${state.applied.y / scale}px`;
                fish.style.rotate = `${(scaleX < 0 ? -1 : 1) * (dart.rot + state.tilt)}deg`;
            });
        }

        // School of minnows: swims across the bowl and off the edge like the fish, then turns round out of sight
        // and comes back in at a new height. It slips over or under project bubbles where there's a gap (planned
        // like a fish's swerve); when it gets close to one ahead that it can't get past, it turns round and darts
        // off instead of bumping it. It never pops bubbles, and the little aerator bubbles don't bother it.
        const minnowSpots = [[-24, -3], [-15, -11], [-13, 7], [-3, -2], [-2, 12], [7, -10], [9, 5], [18, -3], [19, 10], [26, 2]];
        const schoolEl = document.createElement('div');
        schoolEl.className = 'school';
        schoolEl.setAttribute('aria-hidden', 'true');
        const minnows = minnowSpots.map(([x, y]) => {
            const minnow = document.createElement('div');
            minnow.className = 'minnow';
            minnow.style.setProperty('--x', `${x}px`);
            minnow.style.setProperty('--y', `${y}px`);
            const body = document.createElement('div');
            body.className = 'minnow-body';
            body.style.setProperty('--bob', `${1.1 + Math.random() * 0.8}s`);
            body.style.setProperty('--phase', `${-Math.random() * 2}s`);
            minnow.appendChild(body);
            schoolEl.appendChild(minnow);
            return { el: minnow, x };
        });

        const schoolSpeed = 48;      // px/s cruising
        const schoolWary = 26;       // px/s while a bubble it can't yet get past is coming up: it holds back and dodges
        const schoolHover = 8;       // px/s when it's just turned and is boxed in again: it hangs back while it dodges
        const schoolBurst = 80;      // px/s for 0.7s after turning away from a bubble
        const schoolTurnAccel = 600; // px/s²: it stops and speeds off the other way in a fraction of a second
        const schoolTurnGap = 2;     // px: the closest a turn may bring it to a bubble; it turns as late as allows that
        const schoolTurnPause = 800; // ms before a bubble can turn it again, so it doesn't dither between two
        const schoolRepeatPause = 2500; // ms after a quick back-and-forth before it turns again, unless about to touch
        // Ways to turn away from a bubble: straight back, or bouncing back at 30° up or down
        const schoolBounces = [0, -30, 30].map((deg) => ({
            vx: schoolBurst * Math.cos(deg * Math.PI / 180), vy: schoolBurst * Math.sin(deg * Math.PI / 180),
        }));
        const school = {
            x: reduceMotion ? 160 : -60, y: 300, // centre, in px from the bowl's top left; starts just off the left edge
            dir: 1, vx: schoolSpeed, trackY: 300,
            halfWidth: 34, halfHeight: 16, // reach of the outermost minnows (less while it's bunched up)
            turnedAt: -Infinity, prevTurnedAt: -Infinity, burstUntil: -Infinity, waitUntil: 0, waryUntil: 0, bunch: 0, bounce: schoolBounces[0],
            // Its swerves are planned like a fish's (see planSwerve), so it has the same fields
            speed: schoolSpeed, avoidY: 0, vy: 0, dart: null, plan: [], planStart: 0, planAge: Infinity, bumpAt: Infinity,
            searchAfter: Infinity, // simple dodges only, no threading between bubbles: the school gives up and turns sooner
        };

        function turnSchool(now) {
            // The front minnows turn first and the turn ripples back over a quarter of a second
            const fronts = minnows.map((m) => m.x * school.dir);
            const lead = Math.max(...fronts), spread = lead - Math.min(...fronts);
            minnows.forEach((m, i) => m.el.style.setProperty('--lag', `${((lead - fronts[i]) / spread) * 0.25}s`));
            school.dir = -school.dir;
            school.prevTurnedAt = school.turnedAt;
            school.turnedAt = now;
            school.planAge = Infinity; // plan afresh for the new direction
            schoolEl.classList.toggle('facing-right', school.dir > 0);
        }

        function placeSchool() {
            schoolEl.style.transform = `translate(${school.x}px, ${school.y}px)`;
        }
        schoolEl.classList.toggle('facing-right', school.dir > 0);
        placeSchool();

        // Turn the school on or off; a click on the depth readout does this. Off, it's taken out of the page and
        // tick stops swimming it, so it takes no CPU (the minnows' bob animation doesn't run outside the page
        // either). It goes in before the fish (or where they'd go) so it swims behind them. Back on, it swims in
        // from off the edge it's heading away from, at a new height.
        const schoolToggle = document.getElementById('school-toggle');
        function setSchool(on) {
            show.school = on;
            schoolToggle.setAttribute('aria-pressed', String(on));
            if (!on) {
                schoolEl.remove();
                return;
            }
            if (schoolEl.isConnected) return;
            if (!reduceMotion) {
                const size = document.querySelector('.bowl').clientWidth;
                school.x = school.dir > 0 ? -school.halfWidth - 15 : size + school.halfWidth + 15;
                school.trackY = school.y = size * (0.28 + Math.random() * 0.44);
                school.vx = school.dir * schoolSpeed;
                Object.assign(school, { avoidY: 0, vy: 0, plan: [], planAge: Infinity, waitUntil: 0, waryUntil: 0,
                    burstUntil: -Infinity, bunch: 0, turnedAt: -Infinity, prevTurnedAt: -Infinity });
                schoolEl.classList.remove('wary');
                placeSchool();
            }
            (document.querySelector('.fish-swim:not(.fish-4)') ?? fishTemplate).before(schoolEl);
        }
        setSchool(show.school);
        schoolToggle.addEventListener('click', () => setSchool(!show.school));

        function swimSchool(dt, now, bubbles, bowlRect) {
            const size = bowlRect.width;
            const originX = bowlRect.left + bowl.clientLeft;
            const originY = bowlRect.top + bowl.clientTop;
            const [waterMin, waterMax] = waterLimits(bowlRect);

            // Out past the edge of the bowl: wait a moment out of sight, then come back in at a new height, either
            // turning round or (like the red fish) from the other side
            const out = school.dir > 0 ? school.x - school.halfWidth > size + 20 : school.x + school.halfWidth < -20;
            if (out) {
                // While the window isn't active it stays out of sight (see pageActive)
                if (!pageActive) {
                    school.waitUntil = 0;
                    return;
                }
                school.waitUntil ||= now + 1000 + Math.random() * 3000;
                if (now < school.waitUntil) return;
                school.waitUntil = 0;
                school.trackY = school.y = size * (0.28 + Math.random() * 0.44);
                school.avoidY = school.vy = 0;
                school.plan = [];
                if (Math.random() < 0.5) turnSchool(now);
                else school.x = school.dir > 0 ? -school.halfWidth - 15 : size + school.halfWidth + 15;
                school.vx = school.dir * schoolSpeed;
            }

            // The bubbles where they're drawn, in px from the bowl's top left
            const drawn = bubbles.map(({ drawn: d, rise }) => ({ x: d.cx - originX, y: d.cy - originY, r: d.radius, rise }));
            // How far the school's box is from a drawn bubble (negative: overlapping), and which way is out
            const clearance = (x, y, b) => {
                const nx = Math.max(x - school.halfWidth, Math.min(b.x, x + school.halfWidth));
                const ny = Math.max(y - school.halfHeight, Math.min(b.y, y + school.halfHeight));
                return Math.hypot(b.x - nx, b.y - ny) - b.r;
            };

            // Evasive first: while no swerve gets it past a bubble coming up (see planSwerve), it holds back and keeps
            // dodging over or under. If it's still about to touch one, it turns round at the last moment a turn
            // still gets it clear (straight back, or bouncing back at 30° up or down), so it all but touches first.
            const cornered = school.bumpAt < 1.5;
            // It bunches up while dodging, and stays bunched a moment after, so it doesn't flicker in and out.
            // Its box shrinks with the minnows as they draw in, and is full size again as soon as they start to
            // spread, so it always covers them.
            if (cornered) school.waryUntil = now + 600;
            const wary = now < school.waryUntil;
            schoolEl.classList.toggle('wary', wary);
            school.bunch = wary ? Math.min(1, school.bunch + dt / 0.4) : 0;
            school.halfWidth = 34 - 8 * school.bunch;
            school.halfHeight = 16 - 3 * school.bunch;

            // Closest it comes to any bubble over the next `secs` if it turns after `delay` s with `bounce` (no bounce:
            // it carries on). It keeps its speed until then, then brakes and darts off; the bubbles keep rising.
            const closestIfTurning = (delay, bounce, secs = 1) => {
                let closest = Infinity;
                const v0 = school.vx, v1 = bounce ? -school.dir * bounce.vx : v0;
                const brake = Math.sign(v1 - v0) * schoolTurnAccel, reach = Math.abs(v1 - v0) / schoolTurnAccel;
                for (let t = 0; t <= secs; t += 0.025) {
                    const u = Math.max(0, t - delay), ur = Math.min(u, reach);
                    const x = school.x + v0 * Math.min(t, delay) + v0 * ur + brake * ur * ur / 2 + v1 * (u - ur);
                    const y = Math.max(waterMin - originY, Math.min(waterMax - originY,
                        school.y + school.vy * Math.min(t, delay, 0.3) + (bounce ? bounce.vy * u : 0)));
                    for (const b of drawn) closest = Math.min(closest, clearance(x, y, { ...b, y: b.y - b.rise * t }));
                }
                return closest;
            };
            // Turn when carrying on would touch a bubble and waiting another twentieth of a second would leave no
            // clean way out, taking the way out that stays clearest for the next two seconds (so it heads for open
            // water rather than straight at the next bubble). If none is quite clean (boxed in), it still takes the
            // best one once a touch is moments away.
            // Just turned twice in quick succession (boxed in between bubbles): hang back and dodge up or down for a
            // while rather than turning straight back again, unless it's about to touch one
            const pingPong = school.turnedAt - school.prevTurnedAt < 2000 && now - school.turnedAt < schoolRepeatPause;
            const hovering = cornered && pingPong;
            if (cornered && now - school.turnedAt > schoolTurnPause && closestIfTurning(Infinity, null) < schoolTurnGap) {
                // Bouncing up needs room above: up at the top of the water, a bubble rising beneath would catch it
                const roomAbove = school.y - (waterMin - originY) > 60;
                const options = schoolBounces.filter((bounce) => bounce.vy >= 0 || roomAbove).map((bounce) => ({
                    bounce, now: closestIfTurning(0, bounce), later: closestIfTurning(0.05, bounce), ahead: closestIfTurning(0, bounce, 2),
                }));
                const clean = options.filter((o) => o.now >= schoolTurnGap);
                const best = (clean.length ? clean : options).reduce((a, b) => ((clean.length ? b.ahead > a.ahead : b.now > a.now) ? b : a));
                const lastChance = options.every((o) => o.later < schoolTurnGap);
                const touchingSoon = closestIfTurning(0.15, null) < schoolTurnGap && drawn.some((b) => {
                    for (let t = 0; t <= 0.15; t += 0.025) if (clearance(school.x + school.vx * t, school.y, { ...b, y: b.y - b.rise * t }) < 1) return true;
                    return false;
                });
                if ((lastChance && best.now >= schoolTurnGap && !hovering) || (best.now < schoolTurnGap && touchingSoon)) {
                    turnSchool(now);
                    school.burstUntil = now + 700;
