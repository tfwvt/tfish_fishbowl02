                    school.bounce = best.bounce;
                }
            }

            // Ease into the new direction (or speed) rather than snapping
            const bursting = now < school.burstUntil;
            school.speed = bursting ? school.bounce.vx : hovering ? schoolHover : cornered ? schoolWary : schoolSpeed;
            school.vx += Math.max(-schoolTurnAccel * dt, Math.min(schoolTurnAccel * dt, school.dir * school.speed - school.vx));
            school.x += school.vx * dt;

            // Its track wanders gently up and down; swerves over or under bubbles are measured from it. While it
            // darts off after a turn it holds the bounce's climb or dive instead.
            const baseY = school.trackY + 18 * Math.sin((now / 1000) * (2 * Math.PI / 7));
            school.planAge += dt;
            if (school.planAge >= planEvery && !bursting) {
                school.planAge = 0;
                const seen = bubbles.map((b) => ({ ...b, cx: b.drawn.cx, cy: b.drawn.cy, radius: b.drawn.radius }));
                school.plan = planSwerve(school, now, originX + school.x, originY + school.y, originY + baseY,
                    school.halfWidth, school.halfHeight, seen, waterMin, waterMax);
                school.planStart = now;
            }
            const stage = remainingStages(school, now)[0];
            const swerveVy = stage ? stage[0] : Math.max(-relaxSpeed, Math.min(relaxSpeed, -school.avoidY * 2));
            const wantVy = easeAtEdge(bursting ? school.bounce.vy : swerveVy, originY + baseY + school.avoidY, waterMin, waterMax);
            school.vy += Math.max(-steerAccel * dt, Math.min(steerAccel * dt, wantVy - school.vy));
            school.avoidY += school.vy * dt;
            school.y = baseY + school.avoidY;

            // Backstop: the school can't pass through a bubble. If it still ends up overlapping one, ease it back out
            // (at most 3px a frame, so it never jumps) and bounce it off: back the way it came if the bubble was ahead,
            // away up or down if above or below. Pushed up against the top of the water by a bubble rising beneath,
            // it darts off sideways instead of riding the bubble up.
            for (let pass = 0; pass < 3; pass++) {
                let worst = null;
                for (const b of drawn) {
                    const gap = clearance(school.x, school.y, b);
                    if (gap >= 1 || (worst && gap >= worst.gap)) continue;
                    const nx = Math.max(school.x - school.halfWidth, Math.min(b.x, school.x + school.halfWidth));
                    const ny = Math.max(school.y - school.halfHeight, Math.min(b.y, school.y + school.halfHeight));
                    const len = Math.hypot(nx - b.x, ny - b.y);
                    // Way out: from the bubble's centre through the nearest point of the box (straight up or down if
                    // the centre is inside the box)
                    const out = len > 0.01 ? { x: (nx - b.x) / len, y: (ny - b.y) / len } : { x: 0, y: school.y < b.y ? -1 : 1 };
                    const push = len > 0.01 ? 1 - gap : b.r + school.halfHeight + 1 - Math.abs(school.y - b.y);
                    worst = { gap, out, push, b };
                }
                if (!worst) break;
                const push = Math.min(worst.push, 3);
                school.x += worst.out.x * push;
                school.avoidY += worst.out.y * push;
                school.y += worst.out.y * push;
                const atTop = worst.out.y < -0.5 && school.y - (waterMin - originY) < 30;
                const ahead = (worst.b.x - school.x) * school.dir > 0;
                if (now - school.turnedAt > schoolTurnPause && (worst.out.x * school.dir < -0.3 || (atTop && ahead))) {
                    turnSchool(now);
                    school.burstUntil = now + 700;
                    school.bounce = schoolBounces[atTop || worst.out.y > 0.2 ? 2 : worst.out.y < -0.2 ? 1 : 0];
                } else if (atTop && now >= school.burstUntil) {
                    school.burstUntil = now + 700; // already heading away from it: dart on along the top
                    school.bounce = schoolBounces[0];
                }
                if (Math.abs(worst.out.y) > 0.2) school.vy = Math.sign(worst.out.y) * Math.max(Math.abs(school.vy), Math.abs(schoolBounces[1].vy));
            }
            placeSchool();
        }

        // Pops in place; the bubble stays hidden (and out of the tab order) until its next pass from the bottom
        function popBubble(bubble) {
            bubble.classList.add('popping');
            bubble.poppedAt = performance.now();
            bubble.querySelector('button').tabIndex = -1;
            startleFish(bubble);
        }

        // Project detail panel
        const bowl = document.querySelector('.bowl');
        const detail = document.getElementById('project-detail');
        const detailClose = detail.querySelector('.project-detail-close');
        let detailOrigin = 'circle(0 at 50% 50%)';

        function openDetail(project, index, bubble) {
            const bowlRect = bowl.getBoundingClientRect();
            const r = bubble.getBoundingClientRect();
            // Start the reveal as a circle exactly where the bubble was
            detailOrigin = `circle(${r.width / 2}px at ${r.left + r.width / 2 - bowlRect.left}px ${r.top + r.height / 2 - bowlRect.top}px)`;

            detail.querySelector('.project-detail-kicker').textContent =
                `${String(index + 1).padStart(2, '0')} / ${String(projects.length).padStart(2, '0')}`;
            detail.querySelector('.project-detail-title').textContent = project.title;
            detail.querySelector('.project-detail-desc').textContent = project.description;
            const img = detail.querySelector('.project-detail-frame img');
            img.src = project.image;
            img.alt = project.title;

            detail.style.clipPath = detailOrigin;
            detail.hidden = false;
            detail.offsetWidth; // apply the start shape before transitioning
            detail.classList.add('open');
            detail.style.clipPath = 'circle(50% at 50% 50%)';
            detailClose.focus();
        }

        function closeDetail() {
            if (detail.hidden) return;
            detail.classList.remove('open');
            detail.style.clipPath = detailOrigin;
            detailClose.blur();
            if (reduceMotion) detail.hidden = true;
        }

        detail.addEventListener('transitionend', (e) => {
            if (e.target === detail && e.propertyName === 'clip-path' && !detail.classList.contains('open')) {
                detail.hidden = true;
            }
        });
        detailClose.addEventListener('click', closeDetail);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDetail();
        });

        // Bubbles take turns between a left and a right lane. With eight rising only ~80px apart,
        // neighbours would overlap if they could land in the same spot.
        const laneLeft = (i) => `${(i % 2 ? 58 : 28) + Math.random() * 14}%`;

        // Still bubbles for reduced motion, as [left, centre height] in % of the bowl: rows of 3, 2 and 3.
        // Room for eight; add spots here if you add more projects.
        const stillSpots = [[26, 32], [50, 32], [74, 32], [38, 54], [62, 54], [26, 76], [50, 76], [74, 76]];

        // A spread of sizes, from slightly smaller bubbles (68px) up to the biggest (100px), handed out at random
        const bubbleSizes = projects.map((_, i) => 68 + (32 * i) / Math.max(1, projects.length - 1));
        for (let i = bubbleSizes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [bubbleSizes[i], bubbleSizes[j]] = [bubbleSizes[j], bubbleSizes[i]];
        }

        // The bubbles' names are hidden until real projects are attached to them: set this to true to show them.
        // Hidden, each bubble keeps its project's name as its accessible name, for screen readers.
        const showBubbleLabels = false;

        projects.forEach((project, i) => {
            const bubble = document.createElement('div');
            bubble.className = 'project-bubble';
            bubble.style.setProperty('--size', `${bubbleSizes[i]}px`);
            bubble.style.setProperty('--dur', `${riseDuration}s`);
            bubble.style.setProperty('--sway', `${3 + Math.random() * 2}s`);
            bubble.style.left = laneLeft(i);
            // The tank starts empty: each bubble sets off from the bottom in turn, spaced evenly
            // through the first rise. Until its turn it waits, unseen, below the glass.
            bubble.style.animationDelay = `${(i / projects.length) * riseDuration}s`;

            if (reduceMotion) {
                bubble.style.animation = 'none';
                const [left, height] = stillSpots[i % stillSpots.length];
                bubble.style.left = `${left}%`;
                bubble.style.bottom = `calc(${height}% - var(--size) / 2)`;
            }

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'project-bubble-inner';
            if (showBubbleLabels) button.textContent = project.title;
            else button.setAttribute('aria-label', project.title);
            if (reduceMotion) button.style.animation = 'none';

            // Pop the bubble and grow the detail panel out of it
            button.addEventListener('click', () => {
                openDetail(project, i, bubble);
                popBubble(bubble);
            });

            // A waiting bubble is out of the tab order and ignored by the fish until it sets off
            if (!reduceMotion) {
                bubble.classList.add('waiting');
                button.tabIndex = -1;
                bubble.addEventListener('animationstart', (e) => {
                    if (e.target !== bubble) return;
                    bubble.classList.remove('waiting');
                    button.tabIndex = 0;
                });
            }

            // New x position each time it re-enters from the bottom; a popped bubble respawns
            bubble.addEventListener('animationiteration', (e) => {
                if (e.target !== bubble) return;
                bubble.style.left = laneLeft(i);
                bubble.classList.remove('popping');
                button.tabIndex = 0;
            });

            bubble.appendChild(button);
            projectLayer.appendChild(bubble);

            // When its rise began, to put it back in step after it's been stopped (see resyncBubble)
            if (!reduceMotion) {
                const rise = bubble.getAnimations().find((a) => a.animationName === 'project-rise');
                rise?.ready.then(() => { bubble.riseStart = rise.startTime; });
            }
        });

        // Bubbles pop when they bump into a fish or reach the top of the bowl
        function circleHitsRect(cx, cy, radius, rect) {
            // Shrink the fish box a little since the body is a pointed polygon
            const insetX = rect.width * 0.15;
            const insetY = rect.height * 0.2;
            const nearestX = Math.max(rect.left + insetX, Math.min(cx, rect.right - insetX));
            const nearestY = Math.max(rect.top + insetY, Math.min(cy, rect.bottom - insetY));
            return Math.hypot(cx - nearestX, cy - nearestY) < radius;
        }

        // A stopped bubble falls behind its place in the procession. Once it has popped and is out of sight,
        // move it back into step, staying within its current pass so it still comes back from the bottom.
        function resyncBubble(bubble) {
            const rise = bubble.getAnimations().find((a) => a.animationName === 'project-rise');
            if (!rise || rise.startTime === null || bubble.riseStart == null) return;
            const period = riseDuration * 1000;
            const behind = (((rise.startTime - bubble.riseStart) % period) + period) % period;
            if (behind < 5 || behind > period - 5) return;
            const into = (((rise.currentTime - rise.effect.getTiming().delay) % period) + period) % period;
            rise.currentTime += into + behind < period ? behind : behind - period;
        }

        let lastFrame = null;

        // A project bubble starting to pass behind a readout sets it wobbling like jelly, once, dying away. A bubble
        // that arrives while it's still wobbling from another doesn't restart it, so it never jumps mid-wobble.
        // It's on `scale`, which adds to the depth readout's transform rather than replacing it. Like the rest of
        // the motion it runs from tick, so it's off for reduced motion.
        const readouts = [...document.querySelectorAll('.stat-item')];
        const readoutWobble = [
            { scale: '1 1' },
            { scale: '1.035 0.965', offset: 0.15 },
            { scale: '0.975 1.03', offset: 0.35 },
            { scale: '1.015 0.985', offset: 0.55 },
            { scale: '0.995 1.008', offset: 0.75 },
            { scale: '1 1' },
        ];
        const bubblesBehind = new Map(readouts.map((el) => [el, new Set()])); // bubbles overlapping each readout
        const wobbles = new Map(); // each readout's latest wobble
        // Does a circle touch a readout? They're pills, so measure to the line through the middle of one and
        // allow for its rounded ends.
        function circleHitsPill(cx, cy, radius, rect) {
            const end = rect.height / 2;
            const nearestX = Math.max(rect.left + end, Math.min(cx, rect.right - end));
            return Math.hypot(cx - nearestX, cy - (rect.top + end)) < radius + end;
        }

        // Each frame: read all positions first, then steer the fish and pop anything that collided
        function tick(now) {
            const dt = Math.min(0.05, ((now - (lastFrame ?? now)) / 1000) || 1 / 60);
            lastFrame = now;

            const bowlRect = bowl.getBoundingClientRect();
            const bowlX = bowlRect.left + bowlRect.width / 2;
            const bowlY = bowlRect.top + bowlRect.height / 2;
            const bowlRadius = bowlRect.width / 2;
            fishState.forEach((state, fish) => { state.pos = readFish(fish, state); });
            const readoutRects = readouts.map((el) => el.getBoundingClientRect());
            const bubbles = [...document.querySelectorAll('.project-bubble:not(.popping, .waiting)')].map((el) => {
                const r = el.getBoundingClientRect();
                const stopped = el.matches(':hover, :focus-within'); // held still so someone can click it
                // Where it's drawn: it sways side to side, and grows while hovered. The school steers clear of this.
                const d = el.firstElementChild.getBoundingClientRect();
                const drawn = { cx: d.left + d.width / 2, cy: d.top + d.height / 2, radius: d.width / 2 };
                return { el, cx: r.left + r.width / 2, cy: r.top + r.height / 2, radius: r.width / 2, stopped, rise: stopped ? 0 : riseSpeed, drawn };
            });
            const popped = new Set();
            const pop = (b) => {
                if (popped.has(b)) return;
                popped.add(b);
                popBubble(b.el);
            };

            bubbles.forEach((b) => {
                // Note which fish touch it (the triggerfish turns back from a touch mid-turn), even a held bubble
                const touching = [...fishState.values()].filter((st) => circleHitsRect(b.cx, b.cy, b.radius, st.pos.box));
                touching.forEach((st) => { st.touchedAt = now; });

                // Leave a bubble alone while someone is about to click it
                if (b.stopped) return;

                // Only the upper half of the glass counts, so bubbles can enter from below
                const hitTop = b.cy < bowlY && Math.hypot(b.cx - bowlX, b.cy - bowlY) + b.radius >= bowlRadius;
                if (hitTop || touching.length) pop(b);
            });

            // A bubble that rises into a stopped one pops. Two moving ones only touch once a stop has put one
            // out of step; then the lower one, the one rising into the other, pops.
            bubbles.forEach((a, i) => bubbles.slice(i + 1).forEach((b) => {
                if (popped.has(a) || popped.has(b) || Math.hypot(a.cx - b.cx, a.cy - b.cy) >= a.radius + b.radius) return;
                const loser = a.stopped ? b : b.stopped ? a : (a.cy > b.cy ? a : b);
                if (!loser.stopped) pop(loser);
            }));

            document.querySelectorAll('.project-bubble.popping').forEach((el) => {
                if (now - el.poppedAt > 300) resyncBubble(el); // once its pop has faded
            });

            steerFish(dt, now, bubbles.filter((b) => !popped.has(b)), bowlRect);
            fishState.forEach((state) => {
                if (state.swim.classList.contains('fish-4')) guardTriggerfishTurn(state, now);
            });
            if (show.school) swimSchool(dt, now, bubbles.filter((b) => !popped.has(b)), bowlRect);

            readouts.forEach((el, i) => {
                const behind = new Set(bubbles.filter((b) => !popped.has(b)
                    && circleHitsPill(b.drawn.cx, b.drawn.cy, b.drawn.radius, readoutRects[i])).map((b) => b.el));
                const arrived = [...behind].some((b) => !bubblesBehind.get(el).has(b));
                bubblesBehind.set(el, behind);
                if (arrived && wobbles.get(el)?.playState !== 'running') {
                    wobbles.set(el, el.animate(readoutWobble, { duration: 1200, easing: 'ease-in-out' }));
                }
            });
            requestAnimationFrame(tick);
        }

        // While the window isn't active (another window or app has focus, or the tab is hidden), fish that swim
        // off the edge of the bowl wait there instead of coming back in; once it's active again they carry on.
        // The big fish's swims are CSS keyframes, so each is paused at the next point where its keyframes have it
        // out of sight: these fractions of its loop. One already out of sight is paused where it is. The school
        // checks pageActive itself. The triggerfish never leaves the bowl, so it just carries on.
        const offstageAt = { swim1: [0, 0.5], swim2: [0], swim3: [0, 0.5] };
        let pageActive = !document.hidden && document.hasFocus();
        const holdAt = new Map();      // swim animation -> the time in it to pause at
        const heldByUs = new Set();    // swim animations paused here, to start again when the window's active
        let releaseTimers = [];        // the fish come back one by one, not all at once

        function bigFishSwims() {
            return [...document.querySelectorAll('.fish-swim:not(.fish-4)')].flatMap((swim) =>
                swim.getAnimations().filter((a) => a.animationName in offstageAt).map((anim) => ({ swim, anim })));
        }
        // The next time from now (in the animation's own time) that its keyframes put the fish out of sight
        function nextOffstage(anim) {
            const { delay, duration } = anim.effect.getTiming();
            const into = anim.currentTime - delay;
            const loop = Math.floor(into / duration);
            return Math.min(...[loop, loop + 1].flatMap((k) => offstageAt[anim.animationName].map((f) => delay + (k + f) * duration))
                .filter((t) => t >= anim.currentTime));
        }
        function outOfSight(swim) {
            const fish = swim.querySelector('.fish').getBoundingClientRect();
            const glass = bowl.getBoundingClientRect();
            return fish.right <= glass.left || fish.left >= glass.right;
        }
        function hold(anim, at) {
            if (at !== undefined) anim.currentTime = at;
            anim.pause();
            heldByUs.add(anim);
            holdAt.delete(anim);
        }
        // Pause each swim as it reaches its hold point. Its own loop, so it also runs for reduced motion (no tick).
        // When a hidden tab comes back the swims will have run on past their hold points; this winds them back
        // before anything is drawn, so the fish still come back in from the edge.
        function holdFishOffstage() {
            if (pageActive) return;
            holdAt.forEach((at, anim) => {
                if (anim.playState !== 'running') holdAt.delete(anim); // removed with its fish, or already paused
                else if (anim.currentTime >= at) hold(anim, at);
            });
            if (holdAt.size) requestAnimationFrame(holdFishOffstage);
        }
        function setPageActive(active) {
            if (active === pageActive) return;
            pageActive = active;
            if (!active) {
                releaseTimers.forEach(clearTimeout); // any not yet released stay held
                releaseTimers = [];
                bigFishSwims().forEach(({ swim, anim }) => {
                    if (anim.playState !== 'running') return;
                    if (anim.currentTime < anim.effect.getTiming().delay || outOfSight(swim)) hold(anim);
                    else holdAt.set(anim, nextOffstage(anim));
                });
                requestAnimationFrame(holdFishOffstage);
            } else {
                holdAt.clear();
                // Release them in a random order, spread over a few seconds
                [...heldByUs].sort(() => Math.random() - 0.5).forEach((anim, i) => {
                    releaseTimers.push(setTimeout(() => {
                        heldByUs.delete(anim);
                        if (anim.playState === 'paused') anim.play();
                    }, i === 0 ? 0 : i * 1500 + Math.random() * 1000));
                });
            }
        }
        const checkActive = () => setPageActive(!document.hidden && document.hasFocus());
        window.addEventListener('blur', checkActive);
        window.addEventListener('focus', checkActive);
        document.addEventListener('visibilitychange', checkActive);
        if (!pageActive) {
            pageActive = true;
            setPageActive(false);
        }

        if (!reduceMotion) requestAnimationFrame(tick);
    </script>
</body>
</html>
